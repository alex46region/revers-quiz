<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>🎧 Revers Викторина: Neon Stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Syne:wght@700;800&family=Ubuntu+Mono:wght@700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
:root {
  --bg-deep: #05060a;
  --bg-surface: #0e121a;
  --bg-elevated: #161c28;
  
  --neon-yellow: #ffea00;
  --neon-lime: #00ff66;
  --neon-pink: #ff0055;
  --neon-cyan: #00e5ff;
  --neon-purple: #7000ff;
  
  --text-pure: #ffffff;
  --text-dim: #8b9bb4;
  --border-subtle: rgba(255, 255, 255, 0.07);
  --border-glow: rgba(0, 229, 255, 0.4);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Space Grotesk', sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: var(--bg-deep);
  background-image: 
    radial-gradient(ellipse at 50% 0%, rgba(112, 0, 255, 0.25) 0%, transparent 60%),
    radial-gradient(circle at 100% 100%, rgba(255, 0, 85, 0.15) 0%, transparent 40%),
    radial-gradient(circle at 0% 100%, rgba(0, 229, 255, 0.15) 0%, transparent 40%);
  background-attachment: fixed;
  color: var(--text-pure);
  min-height: 100vh;
  padding: 16px 8px 60px;
}

.container {
  max-width: 860px;
  margin: 0 auto;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 24px;
  box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.9), 0 0 1px 1px var(--border-subtle);
  overflow: hidden;
  position: relative;
}

.container::before {
  content: '';
  display: block;
  height: 4px;
  background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink), var(--neon-yellow));
}

.header {
  padding: 32px 20px 20px;
  text-align: center;
}

h1 {
  font-family: 'Syne', sans-serif;
  font-size: 2.2em;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  background: linear-gradient(180deg, #ffffff 30%, #a5b4fc 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

h1 i {
  -webkit-text-fill-color: var(--neon-cyan);
  filter: drop-shadow(0 0 12px var(--neon-cyan));
}

.subtitle {
  font-size: 0.85em;
  font-weight: 700;
  color: var(--neon-yellow);
  text-transform: uppercase;
  letter-spacing: 3px;
  margin-top: 6px;
}

.section {
  background: var(--bg-elevated);
  margin: 16px 20px;
  padding: 20px;
  border-radius: 18px;
  border: 1px solid var(--border-subtle);
  position: relative;
}

.section-title {
  font-family: 'Syne', sans-serif;
  font-size: 1.1em;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-dim);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.section-title i {
  color: var(--neon-cyan);
}

input[type="text"], input[type="number"], select {
  width: 100%;
  padding: 14px 16px;
  background: var(--bg-deep);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  color: var(--text-pure);
  font-size: 15px;
  outline: none;
  transition: 0.2s ease;
}

input[type="text"]:focus, input[type="number"]:focus, select:focus {
  border-color: var(--neon-cyan);
  box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
}

select {
  cursor: pointer;
  appearance: none;
  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300e5ff' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
  background-repeat: no-repeat;
  background-position: right 14px center;
  background-size: 14px;
}

.team-input {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

button {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
}

button:active {
  transform: scale(0.98);
}

.team-input button, #load-songs-btn {
  width: 100%;
  padding: 15px;
  font-size: 15px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.team-input button {
  background: var(--neon-cyan);
  color: #000;
  box-shadow: 0 4px 20px rgba(0, 229, 255, 0.35);
}

#load-songs-btn {
  background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink));
  color: #fff;
  box-shadow: 0 4px 20px rgba(255, 0, 85, 0.35);
}

#shuffle-btn {
  width: 100%;
  padding: 14px;
  background: transparent;
  border: 1px solid var(--border-subtle);
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-size: 14px;
}

#shuffle-btn:hover:not(:disabled) {
  border-color: var(--neon-yellow);
  color: var(--neon-yellow);
  box-shadow: 0 0 12px rgba(255, 234, 0, 0.2);
}

.score-controls {
  display: flex;
  gap: 14px;
  margin-top: 6px;
  flex-wrap: wrap;
}

.score-team-group {
  flex: 1;
  min-width: 240px;
  background: var(--bg-deep);
  border: 1px solid var(--border-subtle);
  border-radius: 16px;
  padding: 16px;
  cursor: pointer;
  transition: all 0.25s ease;
}

.score-team-header {
  text-align: center;
  margin-bottom: 12px;
}

.score-team-label {
  font-size: 0.95em;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.score-display {
  font-family: 'Ubuntu Mono', monospace;
  font-size: 3em;
  font-weight: 700;
  color: var(--text-pure);
  line-height: 1;
  margin: 8px 0;
}

.score-team-group.active {
  border-color: var(--neon-cyan);
  background: rgba(0, 229, 255, 0.03);
  box-shadow: 0 0 25px rgba(0, 229, 255, 0.25), inset 0 0 15px rgba(0, 229, 255, 0.05);
}

.score-team-group.active .score-team-label,
.score-team-group.active .score-display {
  color: var(--neon-cyan);
  text-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
}

.score-btn-row {
  display: flex;
  gap: 6px;
  margin-top: 6px;
}

.btn {
  flex: 1;
  padding: 10px 4px;
  font-size: 0.85em;
  font-weight: 700;
  border-radius: 8px;
}

.btn.add {
  background: rgba(0, 255, 102, 0.1);
  color: var(--neon-lime);
  border: 1px solid rgba(0, 255, 102, 0.25);
}

.btn.add:hover {
  background: var(--neon-lime);
  color: #000;
  box-shadow: 0 0 12px rgba(0, 255, 102, 0.4);
}

.btn.remove {
  background: rgba(255, 0, 85, 0.1);
  color: var(--neon-pink);
  border: 1px solid rgba(255, 0, 85, 0.25);
}

.btn.remove:hover {
  background: var(--neon-pink);
  color: #fff;
  box-shadow: 0 0 12px rgba(255, 0, 85, 0.4);
}

.result-sounds {
  display: flex;
  gap: 12px;
  margin: 18px 0 6px;
  flex-wrap: wrap;
}

.result-btn {
  flex: 1;
  min-width: 140px;
  padding: 16px;
  font-size: 1em;
  text-transform: uppercase;
  letter-spacing: 1px;
  border-radius: 14px;
}

.result-btn.winner {
  background: var(--neon-lime);
  color: #000;
  box-shadow: 0 4px 20px rgba(0, 255, 102, 0.3);
}

.result-btn.lost {
  background: var(--neon-pink);
  color: #fff;
  box-shadow: 0 4px 20px rgba(255, 0, 85, 0.3);
}

.player-container {
  background: var(--bg-deep);
  border: 1px solid var(--border-subtle);
  border-radius: 16px;
  padding: 14px 16px;
  margin: 10px 0;
}

.player-label {
  font-size: 0.85em;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--neon-cyan);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.player-controls {
  display: flex;
  align-items: center;
  gap: 12px;
}

.play-btn {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--neon-cyan);
  color: #000;
  font-size: 14px;
  flex-shrink: 0;
  box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
}

.progress-bar {
  flex: 1;
  height: 6px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 4px;
  cursor: pointer;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: var(--neon-cyan);
  box-shadow: 0 0 8px var(--neon-cyan);
  width: 0%;
}

.time-info {
  font-family: 'Ubuntu Mono', monospace;
  font-size: 0.85em;
  color: var(--text-dim);
  min-width: 85px;
  text-align: right;
}

#next-track-btn {
  width: 100%;
  padding: 16px;
  margin-top: 10px;
  background: var(--neon-yellow);
  color: #000;
  font-size: 15px;
  text-transform: uppercase;
  letter-spacing: 1px;
  box-shadow: 0 4px 20px rgba(255, 234, 0, 0.3);
}

#next-track-btn:disabled {
  background: var(--bg-deep);
  color: #444;
  border: 1px solid var(--border-subtle);
  box-shadow: none;
  cursor: not-allowed;
}

#normal-toggle {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  background: transparent;
  border: 1px solid var(--border-subtle);
  color: var(--text-dim);
}

.song-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px;
  margin-top: 8px;
}

.song-list button {
  background: var(--bg-deep);
  border: 1px solid var(--border-subtle);
  padding: 12px 14px;
  font-size: 13px;
  color: var(--text-pure);
  justify-content: flex-start;
  text-align: left;
  border-radius: 12px;
}

.song-list button:hover:not(.played) {
  border-color: var(--neon-cyan);
  background: rgba(0, 229, 255, 0.05);
  box-shadow: 0 0 15px rgba(0, 229, 255, 0.15);
}

.song-number {
  font-family: 'Ubuntu Mono', monospace;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.05);
  color: var(--neon-cyan);
  font-weight: 700;
  font-size: 0.9em;
  flex-shrink: 0;
}

.song-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.song-list button.played {
  opacity: 0.35;
  filter: grayscale(1);
  border-color: transparent !important;
  cursor: not-allowed;
}

#end-quiz-btn {
  width: 100%;
  padding: 18px;
  margin-top: 20px;
  background: transparent;
  border: 1px solid var(--neon-pink);
  color: var(--neon-pink);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-size: 14px;
}

#end-quiz-btn:hover {
  background: var(--neon-pink);
  color: #fff;
  box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
}

#timer-circle {
  font-family: 'Ubuntu Mono', monospace;
  position: fixed;
  top: 20px;
  right: 20px;
  width: 60px;
  height: 60px;
  border-radius: 16px;
  background: rgba(5, 6, 10, 0.85);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid var(--neon-cyan);
  color: var(--neon-cyan);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.6em;
  font-weight: 700;
  box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

#timer-circle.active {
  opacity: 1;
}

#settings-btn {
  position: fixed;
  top: 20px;
  left: 20px;
  width: 44px;
  height: 44px;
  background: rgba(5, 6, 10, 0.85);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 1000;
}

#settings-btn:hover {
  color: #fff;
  border-color: var(--neon-cyan);
}

#track-name-popup {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(5, 6, 10, 0.95);
  border: 1px solid var(--neon-cyan);
  color: var(--neon-cyan);
  padding: 10px 20px;
  border-radius: 12px;
  font-size: 1.1em;
  font-weight: 700;
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
  transition: opacity 0.3s;
  max-width: 90vw;
  text-align: center;
}

.score-notification, .action-notification {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: var(--bg-surface);
  border: 1px solid var(--neon-cyan);
  padding: 14px 22px;
  border-radius: 14px;
  font-size: 1.1em;
  font-weight: 700;
  z-index: 3000;
  opacity: 0;
  pointer-events: none;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
  transition: opacity 0.2s;
}

.action-notification {
  top: 75px;
  border-color: var(--neon-yellow);
  color: var(--neon-yellow);
}

.score-notification.show, .action-notification.show {
  opacity: 1;
}

#settings-modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}

#settings-modal.active {
  opacity: 1;
  pointer-events: auto;
}

.modal-content {
  background: var(--bg-surface);
  padding: 28px;
  border-radius: 20px;
  width: 90%;
  max-width: 380px;
  border: 1px solid var(--border-subtle);
  position: relative;
}

.modal-content h3 {
  font-family: 'Syne', sans-serif;
  margin-bottom: 16px;
}

.modal-content label {
  display: block;
  font-size: 0.8em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin: 12px 0 4px;
}

.modal-content button:not(.close-modal) {
  width: 100%;
  padding: 14px;
  margin-top: 20px;
  background: var(--neon-cyan);
  color: #000;
}

.close-modal {
  position: absolute;
  top: 16px;
  right: 16px;
  background: transparent;
  border: none;
  color: var(--text-dim);
  font-size: 1.3em;
  cursor: pointer;
}

.winner-screen {
  text-align: center;
  padding: 20px;
}

.winner-screen h2 {
  font-family: 'Syne', sans-serif;
  font-size: 1.8em;
  margin-bottom: 20px;
}

.winner-screen h2 strong {
  color: var(--neon-yellow);
}

.final-scores {
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 1.1em;
  color: var(--text-dim);
}

.final-scores strong {
  font-family: 'Ubuntu Mono', monospace;
  color: #fff;
}
</style>
</head>
<body>

<div id="track-name-popup"></div>
<div id="score-notification" class="score-notification"></div>
<div id="action-notification" class="action-notification"></div>

<div class="container">
  <div class="header">
    <h1><i class="fas fa-bolt"></i> Revers Quiz</h1>
    <div class="subtitle">Угадай трек наоборот</div>
  </div>

  <div class="section">
    <h2 class="section-title"><i class="fas fa-users"></i> Команды</h2>
    <div class="team-input">
      <input type="text" id="team1" placeholder="Команда 1" value="Команда А" />
      <input type="text" id="team2" placeholder="Команда 2" value="Команда Б" />
      <button onclick="setTeams()">Сохранить команды</button>
    </div>
  </div>

  <div class="section" id="folder-section">
    <h2 class="section-title"><i class="fas fa-folder"></i> Категория</h2>
    <select id="folder-select" onchange="saveState()">
      <option value="">-- Выберите категорию --</option>
      <option value="/Зарубежные">🎵 Зарубежные</option>
      <option value="/Русские">🇷🇺 Русские</option>
    </select>
  </div>

  <div class="section">
    <button id="load-songs-btn" onclick="loadFiles()">
      <i class="fas fa-cloud-download-alt"></i> Загрузить треки
    </button>
  </div>

  <div class="section">
    <button id="shuffle-btn" onclick="shuffleTracks()">
      <i class="fas fa-random"></i> Перемешать
    </button>
  </div>

  <div id="quiz-area" style="display: none;">
    <div class="section">
      <h2 class="section-title"><i class="fas fa-trophy"></i> Счёт игры</h2>
      <div class="score-controls">
        <div class="score-team-group" id="score-group-1" onclick="manualActivateTeam(1)">
          <div class="score-team-header">
            <div class="score-team-label" id="team1-label">Команда А</div>
            <div class="score-display" id="score1">0</div>
          </div>
          <div class="score-btn-row remove">
            <button class="btn remove" onclick="event.stopPropagation(); removeScore(1, 0.5)">-0.5</button>
            <button class="btn remove" onclick="event.stopPropagation(); removeScore(1, 1)">-1</button>
            <button class="btn remove" onclick="event.stopPropagation(); removeScore(1, 2)">-2</button>
          </div>
          <div class="score-btn-row add">
            <button class="btn add" onclick="event.stopPropagation(); addScore(1, 0.5)">+0.5</button>
            <button class="btn add" onclick="event.stopPropagation(); addScore(1, 1)">+1</button>
            <button class="btn add" onclick="event.stopPropagation(); addScore(1, 2)">+2</button>
          </div>
        </div>

        <div class="score-team-group" id="score-group-2" onclick="manualActivateTeam(2)">
          <div class="score-team-header">
            <div class="score-team-label" id="team2-label">Команда Б</div>
            <div class="score-display" id="score2">0</div>
          </div>
          <div class="score-btn-row remove">
            <button class="btn remove" onclick="event.stopPropagation(); removeScore(2, 0.5)">-0.5</button>
            <button class="btn remove" onclick="event.stopPropagation(); removeScore(2, 1)">-1</button>
            <button class="btn remove" onclick="event.stopPropagation(); removeScore(2, 2)">-2</button>
          </div>
          <div class="score-btn-row add">
            <button class="btn add" onclick="event.stopPropagation(); addScore(2, 0.5)">+0.5</button>
            <button class="btn add" onclick="event.stopPropagation(); addScore(2, 1)">+1</button>
            <button class="btn add" onclick="event.stopPropagation(); addScore(2, 2)">+2</button>
          </div>
        </div>
      </div>

      <div class="result-sounds">
        <button class="result-btn winner" onclick="playSound('winner')">
          <i class="fas fa-check"></i> Правильно
        </button>
        <button class="result-btn lost" onclick="playSound('lost')">
          <i class="fas fa-times"></i> Мимо
        </button>
      </div>
    </div>

    <div class="section">
      <h2 class="section-title">
        <i class="fas fa-play"></i> Плеер
        <span style="font-size:0.8em; color:var(--neon-yellow); margin-left:6px;">
          (Осталось: <span id="track-counter">0</span>)
        </span>
      </h2>

      <div class="player-container">
        <div class="player-label"><i class="fas fa-backward"></i> Реверс трек</div>
        <div class="player-controls">
          <button class="play-btn" onclick="toggleRevers()">
            <i class="fas fa-play" id="revers-play-icon"></i>
          </button>
          <div class="progress-bar" id="revers-progress-bar" onclick="seekRevers(event)">
            <div class="progress-bar-fill" id="revers-progress-fill"></div>
          </div>
          <div class="time-info">
            <span id="revers-current-time">00:00</span> / <span id="revers-duration">00:00</span>
          </div>
        </div>
      </div>

      <button id="next-track-btn" onclick="playNextTrack()">
        <i class="fas fa-forward"></i> Следующий трек
      </button>

      <div class="player-container" id="original-player" style="display: none; margin-top: 10px;">
        <div class="player-label" style="color: var(--neon-lime);"><i class="fas fa-music"></i> Оригинал трек</div>
        <div class="player-controls">
          <button class="play-btn" style="background: var(--neon-lime);" onclick="toggleNormal()">
            <i class="fas fa-play" id="normal-play-icon"></i>
          </button>
          <div class="progress-bar" id="normal-progress-bar" onclick="seekNormal(event)">
            <div class="progress-bar-fill" id="normal-progress-fill" style="background: var(--neon-lime);"></div>
          </div>
          <div class="time-info">
            <span id="normal-current-time">00:00</span> / <span id="normal-duration">00:00</span>
          </div>
        </div>
      </div>

      <button id="normal-toggle" onclick="showOriginal()">
        Показать оригинал
      </button>
    </div>

    <div class="section">
      <h2 class="section-title"><i class="fas fa-list-ol"></i> Список треков</h2>
      <div class="song-list" id="song-buttons"></div>
    </div>

    <button id="end-quiz-btn" onclick="endQuiz()">
      <i class="fas fa-flag-checkered"></i> Завершить игру
    </button>
  </div>
</div>

<audio id="audio-revers" style="display:none;"></audio>
<audio id="audio-normal" style="display:none;"></audio>
<audio id="audio-winner" style="display:none;"></audio>
<audio id="audio-lost" style="display:none;"></audio>

<div id="settings-btn" onclick="openSettings()">
  <i class="fas fa-sliders-h"></i>
</div>

<div id="timer-circle">0</div>

<div id="settings-modal">
  <div class="modal-content">
    <button class="close-modal" onclick="closeSettings()">&times;</button>
    <h3>Параметры</h3>
    <label for="timer-input">Таймер ответа (сек)</label>
    <input type="number" id="timer-input" min="1" max="300" value="10">
    <label for="mix-mode">Режим треков</label>
    <select id="mix-mode">
      <option value="normal">Обычный (по категории)</option>
      <option value="mixed">Mix Mode (микс всех папок)</option>
    </select>
    <button onclick="setSettings()">Применить</button>
  </div>
</div>

<script>
const PUBLIC_KEY = "https://yadi.sk/d/WuP3cXvzcoZxVg";
let team1Name = "Команда А";
let team2Name = "Команда Б";
let score1 = 0, score2 = 0;
let files = {};
let playedTracks = new Set();
let currentTrackName = null;
let selectedFolder = "";
let winnerUrl = null, lostUrl = null;
let timerDuration = 10;
let mixMode = false;
let timerValue = 0;
let timerInterval = null;
let isTimerActive = false;
let audioContext = null;
let activeTeam = null;
let shouldAutoSwitch = true;
let lastPlayedTrack = null;
let timeStartBuffer = null;
let timeFinalBuffer = null;
let winnerBuffer = null;
let lostBuffer = null;
let ringScoreBuffer = null;
let startSource = null;
let finalSource = null;
let startGainNode = null;
let finalGainNode = null;
let ringScoreSource = null;
let soundsPreloaded = false;
let trackOrder = {};

function initAudio() {
  if (audioContext) return;
  audioContext = new (window.AudioContext || window.webkitAudioContext)();
}
document.addEventListener('click', initAudio, { once: true });
document.addEventListener('touchstart', initAudio, { once: true });

async function preloadAllSounds() {
  if (soundsPreloaded) return;
  try {
    const rootUrl = `https://cloud-api.yandex.net/v1/disk/public/resources?public_key=${encodeURIComponent(PUBLIC_KEY)}&limit=100`;
    const response = await fetch(rootUrl);
    const data = await response.json();
    const items = data._embedded?.items || [];
    const startFile = items.find(f => f.name.toLowerCase().includes('time_start') && f.name.endsWith('.mp3'));
    const finalFile = items.find(f => f.name.toLowerCase().includes('time_final') && f.name.endsWith('.mp3'));
    const winnerFile = items.find(f => f.name.toLowerCase().includes('winner') && f.name.toLowerCase().endsWith('.mp3'));
    const lostFile = items.find(f => f.name.toLowerCase().includes('lost') && f.name.toLowerCase().endsWith('.mp3'));
    const ringFile = items.find(f => f.name.toLowerCase().includes('ring_score') && f.name.toLowerCase().endsWith('.mp3'));
    if (startFile?.file) timeStartBuffer = await loadAudioFile(startFile.file);
    if (finalFile?.file) timeFinalBuffer = await loadAudioFile(finalFile.file);
    if (winnerFile?.file) winnerBuffer = await loadAudioFile(winnerFile.file);
    if (lostFile?.file) lostBuffer = await loadAudioFile(lostFile.file);
    if (ringFile?.file) ringScoreBuffer = await loadAudioFile(ringFile.file);
    soundsPreloaded = true;
  } catch (e) {
    console.error("Ошибка предзагрузки звуков:", e);
  }
}

async function loadAudioFile(url) {
  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error(`Ошибка загрузки: ${url}`);
    const arrayBuffer = await response.arrayBuffer();
    return await audioContext.decodeAudioData(arrayBuffer);
  } catch (e) {
    console.warn("Не удалось загрузить аудио:", e);
    return null;
  }
}

function playTimeStart() {
  if (!audioContext || !timeStartBuffer || isTimerActive === false) return;
  stopCurrentTimerSounds();
  startSource = audioContext.createBufferSource();
  startSource.buffer = timeStartBuffer;
  startGainNode = audioContext.createGain();
  startGainNode.gain.setValueAtTime(0, audioContext.currentTime);
  startSource.connect(startGainNode);
  startGainNode.connect(audioContext.destination);
  startGainNode.gain.linearRampToValueAtTime(1, audioContext.currentTime + 0.5);
  startSource.start();
}

function crossfadeToFinal() {
  if (!audioContext || !timeFinalBuffer) return;
  if (finalSource && finalSource.playbackState !== 2) {
    try { finalSource.stop(); } catch (e) {}
  }
  finalSource = null;
  finalGainNode = null;

  if (startGainNode) {
    startGainNode.gain.cancelScheduledValues(audioContext.currentTime);
    startGainNode.gain.linearRampToValueAtTime(0, audioContext.currentTime + 1.5);
  }

  finalSource = audioContext.createBufferSource();
  finalSource.buffer = timeFinalBuffer;
  finalGainNode = audioContext.createGain();
  finalGainNode.gain.setValueAtTime(0, audioContext.currentTime);
  finalSource.connect(finalGainNode);
  finalGainNode.connect(audioContext.destination);
  finalGainNode.gain.linearRampToValueAtTime(1, audioContext.currentTime + 1.5);
  finalSource.start();

  finalSource.onended = () => {
    stopCurrentTimerSounds();
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
    isTimerActive = false;
    document.getElementById("timer-circle").classList.remove("active");
  };
}

function stopCurrentTimerSounds() {
  if (startSource && startSource.playbackState !== 2) {
    try { startSource.stop(); } catch (e) {}
  }
  if (startGainNode) startGainNode.gain.cancelScheduledValues(audioContext.currentTime);
  startSource = null;
  startGainNode = null;

  if (finalSource && finalSource.playbackState !== 2) {
    try { finalSource.stop(); } catch (e) {}
  }
  finalSource = null;
  finalGainNode = null;
}

function playRingScore() {
  if (!audioContext || !ringScoreBuffer) return;
  const source = audioContext.createBufferSource();
  source.buffer = ringScoreBuffer;
  source.connect(audioContext.destination);
  source.start();
}

function playSound(type) {
  stopAllSounds();
  const buffer = type === 'winner' ? winnerBuffer : lostBuffer;
  if (buffer) {
    const source = audioContext.createBufferSource();
    source.buffer = buffer;
    source.connect(audioContext.destination);
    source.start();
  } else {
    alert(`Файл ${type.toUpperCase()} не найден`);
  }
}

function formatTime(seconds) {
  seconds = Math.floor(seconds || 0);
  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;
  return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
}

window.addEventListener('load', () => {
  const saved = localStorage.getItem('reversQuiz');
  if (saved) {
    const data = JSON.parse(saved);
    team1Name = data.team1 || "Команда А";
    team2Name = data.team2 || "Команда Б";
    score1 = parseFloat(data.score1) || 0;
    score2 = parseFloat(data.score2) || 0;
    playedTracks = new Set(data.playedTracks || []);
    selectedFolder = data.selectedFolder || "";
    timerDuration = data.timerDuration || 10;
    mixMode = data.mixMode || false;
    activeTeam = data.activeTeam || null;
    shouldAutoSwitch = data.shouldAutoSwitch !== false;
    lastPlayedTrack = data.lastPlayedTrack || null;
    trackOrder = data.trackOrder || {};
    document.getElementById("team1-label").textContent = team1Name;
    document.getElementById("team2-label").textContent = team2Name;
    document.getElementById("score1").textContent = score1.toFixed(1);
    document.getElementById("score2").textContent = score2.toFixed(1);
    updateFolderSection();
    if (Object.keys(trackOrder).length > 0) {
      document.getElementById("quiz-area").style.display = "block";
      generateSongButtons();
      updateTrackCounter();
      activateTeam(activeTeam);
      updateShuffleButtonState();
      updateNextTrackButton();
    }
  }
});

function setTeams() {
  const t1 = document.getElementById("team1").value.trim();
  const t2 = document.getElementById("team2").value.trim();
  if (!t1 || !t2) {
    alert("Введите оба названия команд!");
    return;
  }
  team1Name = t1;
  team2Name = t2;
  document.getElementById("team1-label").textContent = t1;
  document.getElementById("team2-label").textContent = t2;
  saveState();
  showActionNotification('✅ Составы обновлены!');
}

function updateFolderSection() {
  const folderSection = document.getElementById("folder-section");
  folderSection.style.display = mixMode ? "none" : "block";
}

async function fetchFolderFiles(path) {
  const limit = 100;
  let offset = 0;
  let allItems = [];
  let files = {};
  try {
    while (true) {
      const url = `https://cloud-api.yandex.net/v1/disk/public/resources?public_key=${encodeURIComponent(PUBLIC_KEY)}&path=${encodeURIComponent(path)}&limit=${limit}&offset=${offset}`;
      const response = await fetch(url);
      if (!response.ok) break;
      const data = await response.json();
      const items = data._embedded?.items;
      if (!items || items.length === 0) break;
      allItems.push(...items);
      if (items.length < limit) break;
      offset += limit;
    }
    const mp3Files = allItems.filter(f => f.name?.toLowerCase().endsWith('.mp3'));
    mp3Files.forEach(file => {
      const cleanName = file.name.replace(/_(REVERS|NORMAL)\.mp3$/i, "");
      if (!files[cleanName]) files[cleanName] = {};
      if (file.name.includes("_REVERS")) files[cleanName].revers = file.file;
      if (file.name.includes("_NORMAL")) files[cleanName].normal = file.file;
    });
    return files;
  } catch (e) {
    console.error("Ошибка загрузки папки:", e);
    return {};
  }
}

function isTrackOrderValid(files) {
  const fileNames = new Set(Object.keys(files));
  const orderNames = new Set(Object.keys(trackOrder));
  if (fileNames.size !== orderNames.size) return false;
  for (let name of fileNames) {
    if (!orderNames.has(name)) return false;
  }
  return true;
}

async function loadFiles() {
  try {
    let allFiles = {};
    if (mixMode) {
      const rPromise = fetchFolderFiles("/Русские").catch(e => ({ }));
      const fPromise = fetchFolderFiles("/Зарубежные").catch(e => ({ }));
      const [rFiles, fFiles] = await Promise.all([rPromise, fPromise]);
      const rNames = Object.keys(rFiles).sort(() => Math.random() - 0.5);
      const fNames = Object.keys(fFiles).sort(() => Math.random() - 0.5);
      const maxLength = Math.max(rNames.length, fNames.length);
      const mixedFiles = {};
      const newTrackOrder = {};
      let index = 0;
      for (let i = 0; i < maxLength; i++) {
        if (rNames[i]) {
          const name = rNames[i];
          mixedFiles[name] = { ...rFiles[name] };
          newTrackOrder[name] = ++index;
        }
        if (fNames[i]) {
          const name = fNames[i];
          mixedFiles[name] = { ...(mixedFiles[name] || {}), ...fFiles[name] };
          if (!newTrackOrder[name]) newTrackOrder[name] = ++index;
        }
      }
      allFiles = mixedFiles;
      trackOrder = newTrackOrder;
      const shuffleBtn = document.getElementById("shuffle-btn");
      shuffleBtn.disabled = true;
      shuffleBtn.textContent = '🔁 Чередование';
      shuffleBtn.title = "В смешанном режиме порядок определяется автоматически";
    } else {
      const path = document.getElementById("folder-select").value;
      if (!path) {
        return alert("Выберите категорию!");
      }
      allFiles = await fetchFolderFiles(path);
      if (Object.keys(trackOrder).length === 0 || !isTrackOrderValid(allFiles)) {
        const names = Object.keys(allFiles).sort();
        trackOrder = {};
        names.forEach((name, idx) => {
          trackOrder[name] = idx + 1;
        });
      }
      updateShuffleButtonState();
    }
    if (Object.keys(allFiles).length === 0) {
      return alert("Файлы не найдены.");
    }
    files = allFiles;
    updateTrackCounter();
    document.getElementById("quiz-area").style.display = "block";
    generateSongButtons();
    saveState();
    if (!soundsPreloaded) {
      setTimeout(() => preloadAllSounds(), 100);
    }
    updateNextTrackButton();
  } catch (e) {
    console.error("КРИТИЧЕСКАЯ ОШИБКА ЗАГРУЗКИ:", e);
    alert("Ошибка загрузки: проверьте интернет или структуру папок.");
  }
}

function updateShuffleButtonState() {
  const shuffleBtn = document.getElementById("shuffle-btn");
  const hasStarted = lastPlayedTrack !== null;
  shuffleBtn.disabled = hasStarted;
  shuffleBtn.style.opacity = hasStarted ? 0.4 : 1;
  shuffleBtn.style.cursor = hasStarted ? "not-allowed" : "pointer";
  shuffleBtn.textContent = hasStarted ? '❌ Игра начата (порядок зафиксирован)' : '🔄 Перемешать треки';
  shuffleBtn.title = hasStarted ? "Нельзя перемешивать после начала игры" : "Перемешать треки в случайном порядке";
}

function shuffleTracks() {
  if (lastPlayedTrack !== null) {
    showActionNotification('❌ Нельзя перемешивать после начала!');
    return;
  }
  const names = Object.keys(files);
  const shuffled = [...names].sort(() => Math.random() - 0.5);
  trackOrder = {};
  shuffled.forEach((name, index) => {
    trackOrder[name] = index + 1;
  });
  generateSongButtons();
  saveState();
  showActionNotification('✅ Треки перемешаны!');
  updateNextTrackButton();
}

function showActionNotification(text) {
  const notif = document.getElementById("action-notification");
  notif.textContent = text;
  notif.classList.add("show");
  setTimeout(() => {
    notif.classList.remove("show");
  }, 2000);
}

function generateSongButtons() {
  const container = document.getElementById("song-buttons");
  container.innerHTML = "";
  const sortedNames = Object.keys(files).sort((a, b) => (trackOrder[a] || 0) - (trackOrder[b] || 0));
  sortedNames.forEach(name => {
    const btn = document.createElement("button");
    btn.setAttribute("data-song", name);
    btn.onclick = () => {
      playTrack(name);
    };
    if (playedTracks.has(name)) btn.classList.add("played");
    const number = document.createElement("span");
    number.className = "song-number";
    number.textContent = trackOrder[name] || "?";
    const title = document.createElement("span");
    title.className = "song-name";
    title.textContent = name;
    btn.appendChild(number);
    btn.appendChild(title);
    container.appendChild(btn);
  });
  updateNextTrackButton();
}

function playTrack(name) {
  hideOriginal();
  stopAllSounds();
  hideTrackPopup();
  currentTrackName = name;
  const track = files[name];
  if (track?.revers) {
    const audio = document.getElementById("audio-revers");
    audio.src = track.revers;
    audio.load();
    audio.onended = () => {
      if (timerDuration > 0) startTimer();
      hideTrackPopup();
    };
    audio.onloadedmetadata = () => {
      document.getElementById("revers-duration").textContent = formatTime(audio.duration);
    };
    toggleRevers();
  }
  updateShuffleButtonState();
  updateNextTrackButton();
}

function playNextTrack() {
  const allNames = Object.keys(files).sort((a, b) => (trackOrder[a] || 0) - (trackOrder[b] || 0));
  const unplayed = allNames.filter(name => !playedTracks.has(name));
  if (unplayed.length === 0) {
    showActionNotification('❗ Все треки сыграны');
    return;
  }
  const nextTrack = unplayed[0];
  playTrack(nextTrack);
}

function updateNextTrackButton() {
  const btn = document.getElementById("next-track-btn");
  const allNames = Object.keys(files);
  const unplayed = allNames.filter(name => !playedTracks.has(name));
  btn.disabled = unplayed.length === 0;
}

function showTrackPopup(name) {
  const popup = document.getElementById("track-name-popup");
  popup.textContent = name;
  popup.style.opacity = 1;
}

function hideTrackPopup() {
  document.getElementById("track-name-popup").style.opacity = 0;
}

function toggleRevers() {
  const audio = document.getElementById("audio-revers");
  const normal = document.getElementById("audio-normal");
  const icon = document.getElementById("revers-play-icon");
  if (!normal.paused) {
    normal.pause();
    document.getElementById("normal-play-icon").classList.replace("fa-pause", "fa-play");
  }
  if (audio.paused) {
    stopTimer();
    audio.play();
    icon.classList.replace("fa-play", "fa-pause");
    showTrackPopup(currentTrackName);
    updateReversProgress();
    if (currentTrackName !== lastPlayedTrack) {
      if (shouldAutoSwitch && activeTeam !== null) {
        const next = activeTeam === 1 ? 2 : 1;
        activateTeam(next);
      }
      shouldAutoSwitch = true;
      lastPlayedTrack = currentTrackName;
    }
  } else {
    audio.pause();
    icon.classList.replace("fa-play", "fa-pause");
    hideTrackPopup();
  }
  updateShuffleButtonState();
  updateNextTrackButton();
}

function manualActivateTeam(team) {
  activateTeam(team);
  shouldAutoSwitch = false;
}

function activateTeam(team) {
  document.getElementById("score-group-1").classList.remove("active");
  document.getElementById("score-group-2").classList.remove("active");
  if (team === 1) {
    document.getElementById("score-group-1").classList.add("active");
  } else if (team === 2) {
    document.getElementById("score-group-2").classList.add("active");
  }
  activeTeam = team;
  saveState();
}

function showOriginal() {
  const p = document.getElementById("original-player");
  const b = document.getElementById("normal-toggle");
  p.style.display = p.style.display === "none" ? "block" : "none";
  b.textContent = p.style.display === "none" ? "Показать оригинал" : "Скрыть оригинал";
  if (p.style.display === "none") document.getElementById("audio-normal").pause();
}

function hideOriginal() {
  const p = document.getElementById("original-player");
  p.style.display = "none";
  document.getElementById("normal-toggle").textContent = "Показать оригинал";
  document.getElementById("audio-normal").pause();
  document.getElementById("normal-play-icon").classList.replace("fa-pause", "fa-play");
}

function toggleNormal() {
  const a = document.getElementById("audio-normal");
  const r = document.getElementById("audio-revers");
  const i = document.getElementById("normal-play-icon");
  if (a.paused) {
    stopTimer();
    r.pause();
    document.getElementById("revers-play-icon").classList.replace("fa-pause", "fa-play");
    a.src = files[currentTrackName]?.normal;
    a.load();
    a.play();
    i.classList.replace("fa-play", "fa-pause");
    updateNormalProgress();
    a.onloadedmetadata = () => {
      document.getElementById("normal-duration").textContent = formatTime(a.duration);
    };
  } else {
    a.pause();
    i.classList.replace("fa-play", "fa-pause");
  }
}

function updateReversProgress() {
  const a = document.getElementById("audio-revers");
  const fill = document.getElementById("revers-progress-fill");
  const currentTimeEl = document.getElementById("revers-current-time");
  const duration = isNaN(a.duration) ? 0 : a.duration;
  const progress = a.currentTime / duration;
  fill.style.width = `${progress * 100 || 0}%`;
  currentTimeEl.textContent = formatTime(a.currentTime);
  if (!a.paused) requestAnimationFrame(updateReversProgress);
}

function updateNormalProgress() {
  const a = document.getElementById("audio-normal");
  const fill = document.getElementById("normal-progress-fill");
  const currentTimeEl = document.getElementById("normal-current-time");
  const duration = isNaN(a.duration) ? 0 : a.duration;
  const progress = a.currentTime / duration;
  fill.style.width = `${progress * 100 || 0}%`;
  currentTimeEl.textContent = formatTime(a.currentTime);
  if (!a.paused) requestAnimationFrame(updateNormalProgress);
}

function seekRevers(e) {
  const bar = document.getElementById("revers-progress-bar");
  const audio = document.getElementById("audio-revers");
  const percent = e.offsetX / bar.offsetWidth;
  audio.currentTime = percent * audio.duration;
}

function seekNormal(e) {
  const bar = document.getElementById("normal-progress-bar");
  const audio = document.getElementById("audio-normal");
  const percent = e.offsetX / bar.offsetWidth;
  audio.currentTime = percent * audio.duration;
}

function markAsPlayed() {
  if (currentTrackName && !playedTracks.has(currentTrackName)) {
    playedTracks.add(currentTrackName);
    updateTrackCounter();
    saveState();
    document.querySelectorAll(`[data-song="${currentTrackName}"]`).forEach(btn => {
      btn.classList.add("played");
      btn.disabled = true;
    });
    updateNextTrackButton();
  }
}

document.getElementById("audio-revers").addEventListener("playing", markAsPlayed);

function showNotification(text, isAddition = true) {
  const notif = document.getElementById("score-notification");
  notif.innerHTML = text;
  notif.style.color = isAddition ? 'var(--neon-lime)' : 'var(--neon-pink)';
  notif.style.borderColor = isAddition ? 'var(--neon-lime)' : 'var(--neon-pink)';
  notif.classList.add("show");
  setTimeout(() => {
    notif.classList.remove("show");
  }, 1200);
}

function addScore(team, points) {
  if (team === 1) score1 += points;
  else if (team === 2) score2 += points;
  document.getElementById("score1").textContent = score1.toFixed(1);
  document.getElementById("score2").textContent = score2.toFixed(1);
  saveState();
  playRingScore();
  showNotification(`+${points} (${team === 1 ? team1Name : team2Name})`, true);
}

function removeScore(team, points) {
  if (team === 1) score1 = Math.max(0, score1 - points);
  else if (team === 2) score2 = Math.max(0, score2 - points);
  document.getElementById("score1").textContent = score1.toFixed(1);
  document.getElementById("score2").textContent = score2.toFixed(1);
  saveState();
  showNotification(`-${points} (${team === 1 ? team1Name : team2Name})`, false);
}

function stopAllSounds() {
  ["audio-revers", "audio-normal"].forEach(id =>
    document.getElementById(id).pause()
  );
  stopTimer();
}

function updateTrackCounter() {
  document.getElementById("track-counter").textContent = Object.keys(files).length - playedTracks.size;
  updateNextTrackButton();
}

function saveState() {
  localStorage.setItem('reversQuiz', JSON.stringify({
    team1: team1Name,
    team2: team2Name,
    score1, score2,
    playedTracks: Array.from(playedTracks),
    selectedFolder,
    timerDuration,
    mixMode,
    activeTeam,
    shouldAutoSwitch,
    lastPlayedTrack,
    trackOrder
  }));
}

function endQuiz() {
  localStorage.removeItem('reversQuiz');
  stopAllSounds();
  const quizArea = document.getElementById("quiz-area");
  quizArea.innerHTML = '';
  const resultDiv = document.createElement('div');
  resultDiv.className = 'winner-screen';
  resultDiv.innerHTML = `
    <h2>🏆 Итоги битвы:<br><strong>${score1 > score2 ? team1Name : score2 > score1 ? team2Name : "Ничья!"}</strong></h2>
    <div class="final-scores">
      <div>${team1Name}: <strong>${score1.toFixed(1)}</strong></div>
      <div>${team2Name}: <strong>${score2.toFixed(1)}</strong></div>
    </div>
  `;
  quizArea.appendChild(resultDiv);
  const restartBtn = document.createElement("button");
  restartBtn.innerHTML = '<i class="fas fa-redo"></i> Новая игра';
  restartBtn.style.cssText = `
    width: 100%;
    padding: 16px;
    margin-top: 24px;
    background: var(--neon-cyan);
    color: #000;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 1px;
  `;
  restartBtn.onclick = () => location.reload();
  quizArea.appendChild(restartBtn);
}

function openSettings() {
  document.getElementById("timer-input").value = timerDuration;
  document.getElementById("mix-mode").value = mixMode ? "mixed" : "normal";
  document.getElementById("settings-modal").classList.add("active");
}

function closeSettings() {
  document.getElementById("settings-modal").classList.remove("active");
}

function setSettings() {
  const input = document.getElementById("timer-input");
  const mode = document.getElementById("mix-mode").value;
  const value = parseInt(input.value);
  if (isNaN(value) || value < 1 || value > 300) return alert("Таймер: от 1 до 300 сек.");
  timerDuration = value;
  mixMode = mode === "mixed";
  closeSettings();
  updateFolderSection();
  saveState();
  showActionNotification('⚙️ Настройки применены');
}

function startTimer() {
  if (isTimerActive) return;
  isTimerActive = true;
  timerValue = timerDuration;
  document.getElementById("timer-circle").classList.add("active");
  updateTimerDisplay();
  playTimeStart();
  timerInterval = setInterval(() => {
    timerValue--;
    updateTimerDisplay();
    if (timerValue === 1) {
      crossfadeToFinal();
    }
    if (timerValue <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }, 1000);
}

function stopTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  isTimerActive = false;
  document.getElementById("timer-circle").classList.remove("active");
  stopCurrentTimerSounds();
}

function updateTimerDisplay() {
  const el = document.getElementById("timer-circle");
  el.textContent = timerValue;
  const isUrgent = timerValue <= 5;
  el.style.borderColor = isUrgent ? "var(--neon-pink)" : "var(--neon-cyan)";
  el.style.color = isUrgent ? "var(--neon-pink)" : "var(--neon-cyan)";
  el.style.boxShadow = isUrgent ? "0 0 20px rgba(255, 0, 85, 0.5)" : "0 0 20px rgba(0, 229, 255, 0.4)";
}
</script>
</body>
</html>
