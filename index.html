<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#05060a" />
<title>🎧 Revers Викторина: Neon Stage</title>

<!-- PWA Manifest и Service Worker -->
<link rel="manifest" href="manifest.json">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(console.warn);
  }
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Syne:wght@700;800&family=Ubuntu+Mono:wght@700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
:root {
  --bg-deep: #05060a;
  --bg-surface: #0e121a;
  --bg-elevated: #161c28;
  
  --neon-yellow: #ffea00;
  --neon-lime: #00ff66;
  --neon-pink: #ff0055;
  --neon-cyan: #00e5ff;
  --neon-purple: #7000ff;
  
  --text-pure: #ffffff;
  --text-dim: #8b9bb4;
  --border-subtle: rgba(255, 255, 255, 0.07);
  --border-glow: rgba(0, 229, 255, 0.4);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Space Grotesk', sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: var(--bg-deep);
  background-image: 
    radial-gradient(ellipse at 50% 0%, rgba(112, 0, 255, 0.25) 0%, transparent 60%),
    radial-gradient(circle at 100% 100%, rgba(255, 0, 85, 0.15) 0%, transparent 40%),
    radial-gradient(circle at 0% 100%, rgba(0, 229, 255, 0.15) 0%, transparent 40%);
  background-attachment: fixed;
  color: var(--text-pure);
  min-height: 100vh;
  padding: 16px 8px 60px;
}

.container {
  max-width: 860px;
  margin: 0 auto;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 24px;
  box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.9), 0 0 1px 1px var(--border-subtle);
  overflow: hidden;
  position: relative;
}

.container::before {
  content: '';
  display: block;
  height: 4px;
  background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink), var(--neon-yellow));
}

.header {
  padding: 32px 20px 20px;
  text-align: center;
}

h1 {
  font-family: 'Syne', sans-serif;
  font-size: 2.2em;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  background: linear-gradient(180deg, #ffffff 30%, #a5b4fc 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

h1 i {
  -webkit-text-fill-color: var(--neon-cyan);
  filter: drop-shadow(0 0 12px var(--neon-cyan));
}

.subtitle {
  font-size: 0.85em;
  font-weight: 700;
  color: var(--neon-yellow);
  text-transform: uppercase;
  letter-spacing: 3px;
  margin-top: 6px;
}

.section {
  background: var(--bg-elevated);
  margin: 16px 20px;
  padding: 20px;
  border-radius: 18px;
  border: 1px solid var(--border-subtle);
  position: relative;
}

.section-title {
  font-family: 'Syne', sans-serif;
  font-size: 1.1em;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-dim);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.section-title i {
  color: var(--neon-cyan);
}

input[type="text"], input[type="number"], select {
  width: 100%;
  padding: 14px 16px;
  background: var(--bg-deep);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  color: var(--text-pure);
  font-size: 15px;
  outline: none;
  transition: 0.2s ease;
}

input[type="text"]:focus, input[type="number"]:focus, select:focus {
  border-color: var(--neon-cyan);
  box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
}

select {
  cursor: pointer;
  appearance: none;
  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300e5ff' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
  background-repeat: no-repeat;
  background-position: right 14px center;
  background-size: 14px;
}

.team-input {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

button {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
}

button:active {
  transform: scale(0.98);
}

.team-input button, #load-songs-btn {
  width: 100%;
  padding: 15px;
  font-size: 15px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.team-input button {
  background: var(--neon-cyan);
  color: #000;
  box-shadow: 0 4px 20px rgba(0, 229, 255, 0.35);
}

#load-songs-btn {
  background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink));
  color: #fff;
  box-shadow: 0 4px 20px rgba(255, 0, 85, 0.35);
}

#shuffle-btn {
  width: 100%;
  padding: 14px;
  background: transparent;
  border: 1px solid var(--border-subtle);
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-size: 14px;
}

#shuffle-btn:hover:not(:disabled) {
  border-color: var(--neon-yellow);
  color: var(--neon-yellow);
  box-shadow: 0 0 12px rgba(255, 234, 0, 0.2);
}

.score-controls {
  display: flex;
  gap: 14px;
  margin-top: 6px;
  flex-wrap: wrap;
}

.score-team-group {
  flex: 1;
  min-width: 240px;
  background: var(--bg-deep);
  border: 1px solid var(--border-subtle);
  border-radius: 16px;
  padding: 16px;
  cursor: pointer;
  transition: all 0.25s ease;
}

.score-team-header {
  text-align: center;
  margin-bottom: 12px;
}

.score-team-label {
  font-size: 0.95em;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.score-display {
  font-family: 'Ubuntu Mono', monospace;
  font-size: 3em;
  font-weight: 700;
  color: var(--text-pure);
  line-height: 1;
  margin: 8px 0;
}

.score-team-group.active {
  border-color: var(--neon-cyan);
  background: rgba(0, 229, 255, 0.03);
  box-shadow: 0 0 25px rgba(0, 229, 255, 0.25), inset 0 0 15px rgba(0, 229, 255, 0.05);
}

.score-team-group.active .score-team-label,
.score-team-group.active .score-display {
  color: var(--neon-cyan);
  text-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
}

.score-btn-row {
  display: flex;
  gap: 6px;
  margin-top: 6px;
}

.btn {
  flex: 1;
  padding: 10px 4px;
  font-size: 0.85em;
  font-weight: 700;
  border-radius: 8px;
}

.btn.add {
  background: rgba(0, 255, 102, 0.1);
  color: var(--neon-lime);
  border: 1px solid rgba(0, 255, 102, 0.25);
}

.btn.add:hover {
  background: var(--neon-lime);
  color: #000;
  box-shadow: 0 0 12px rgba(0, 255, 102, 0.4);
}

.btn.remove {
  background: rgba(255, 0, 85, 0.1);
  color: var(--neon-pink);
  border: 1px solid rgba(255, 0, 85, 0.25);
}

.btn.remove:hover {
  background: var(--neon-pink);
  color: #fff;
  box-shadow: 0 0 12px rgba(255, 0, 85, 0.4);
}

.result-sounds {
  display: flex;
  gap: 12px;
  margin: 18px 0 6px;
  flex-wrap: wrap;
}

.result-btn {
  flex: 1;
  min-width: 140px;
  padding: 16px;
  font-size: 1em;
  text-transform: uppercase;
  letter-spacing: 1px;
  border-radius: 14px;
}

.result-btn.winner {
  background: var(--neon-lime);
  color: #000;
  box-shadow: 0 4px 20px rgba(0, 255, 102, 0.3);
}

.result-btn.lost {
  background: var(--neon-pink);
  color: #fff;
  box-shadow: 0 4px 20px rgba(255, 0, 85, 0.3);
}

.player-container {
  background: var(--bg-deep);
  border: 1px solid var(--border-subtle);
  border-radius: 16px;
  padding: 14px 16px;
  margin: 10px 0;
}

.player-label {
  font-size: 0.85em;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--neon-cyan);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.player-controls {
  display: flex;
  align-items: center;
  gap: 12px;
}

.play-btn {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--neon-cyan);
  color: #000;
  font-size: 14px;
  flex-shrink: 0;
  box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
}

.progress-bar {
  flex: 1;
  height: 6px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 4px;
  cursor: pointer;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: var(--neon-cyan);
  box-shadow: 0 0 8px var(--neon-cyan);
  width: 0%;
}

.time-info {
  font-family: 'Ubuntu Mono', monospace;
  font-size: 0.85em;
  color: var(--text-dim);
  min-width: 85px;
  text-align: right;
}

#next-track-btn {
  width: 100%;
  padding: 16px;
  margin-top: 10px;
  background: var(--neon-yellow);
  color: #000;
  font-size: 15px;
  text-transform: uppercase;
  letter-spacing: 1px;
  box-shadow: 0 4px 20px rgba(255, 234, 0, 0.3);
}

#next-track-btn:disabled {
  background: var(--bg-deep);
  color: #444;
  border: 1px solid var(--border-subtle);
  box-shadow: none;
  cursor: not-allowed;
}

#normal-toggle {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  background: transparent;
  border: 1px solid var(--border-subtle);
  color: var(--text-dim);
}

.song-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px;
  margin-top: 8px;
}

.song-list button {
  background: var(--bg-deep);
  border: 1px solid var(--border-subtle);
  padding: 12px 14px;
  font-size: 13px;
  color: var(--text-pure);
  justify-content: flex-start;
  text-align: left;
  border-radius: 12px;
}

.song-list button:hover:not(.played) {
  border-color: var(--neon-cyan);
  background: rgba(0, 229, 255, 0.05);
  box-shadow: 0 0 15px rgba(0, 229, 255, 0.15);
}

.song-number {
  font-family: 'Ubuntu Mono', monospace;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.05);
  color: var(--neon-cyan);
  font-weight: 700;
  font-size: 0.9em;
  flex-shrink: 0;
}

.song-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.song-list button.played {
  opacity: 0.35;
  filter: grayscale(1);
  border-color: transparent !important;
  cursor: not-allowed;
}

#end-quiz-btn {
  width: 100%;
  padding: 18px;
  margin-top: 20px;
  background: transparent;
  border: 1px solid var(--neon-pink);
  color: var(--neon-pink);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-size: 14px;
}

#end-quiz-btn:hover {
  background: var(--neon-pink);
  color: #fff;
  box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
}

#timer-circle {
  font-family: 'Ubuntu Mono', monospace;
  position: fixed;
  top: 20px;
  right: 20px;
  width: 60px;
  height: 60px;
  border-radius: 16px;
  background: rgba(5, 6, 10, 0.85);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid var(--neon-cyan);
  color: var(--neon-cyan);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.6em;
  font-weight: 700;
  box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

#timer-circle.active {
  opacity: 1;
}

#settings-btn {
  position: fixed;
  top: 20px;
  left: 20px;
  width: 44px;
  height: 44px;
  background: rgba(5, 6, 10, 0.85);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 1000;
}

#settings-btn:hover {
  color: #fff;
  border-color: var(--neon-cyan);
}

#track-name-popup {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(5, 6, 10, 0.95);
  border: 1px solid var(--neon-cyan);
  color: var(--neon-cyan);
  padding: 10px 20px;
  border-radius: 12px;
  font-size: 1.1em;
  font-weight: 700;
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
  transition: opacity 0.3s;
  max-width: 90vw;
  text-align: center;
}

.score-notification, .action-notification {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: var(--bg-surface);
  border: 1px solid var(--neon-cyan);
  padding: 14px 22px;
  border-radius: 14px;
  font-size: 1.1em;
  font-weight: 700;
  z-index: 3000;
  opacity: 0;
  pointer-events: none;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
  transition: opacity 0.2s;
}

.action-notification {
  top: 75px;
  border-color: var(--neon-yellow);
  color: var(--neon-yellow);
}

.score-notification.show, .action-notification.show {
  opacity: 1;
}

#settings-modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}

#settings-modal.active {
  opacity: 1;
  pointer-events: auto;
}

.modal-content {
  background: var(--bg-surface);
  padding: 28px;
  border-radius: 20px;
  width: 90%;
  max-width: 380px;
  border: 1px solid var(--border-subtle);
  position: relative;
}

.modal-content h3 {
  font-family: 'Syne', sans-serif;
  margin-bottom: 16px;
}

.modal-content label {
  display: block;
  font-size: 0.8em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin: 12px 0 4px;
}

.modal-content button:not(.close-modal) {
  width: 100%;
  padding: 14px;
  margin-top: 20px;
  background: var(--neon-cyan);
  color: #000;
}

.close-modal {
  position: absolute;
  top: 16px;
  right: 16px;
  background: transparent;
  border: none;
  color: var(--text-dim);
  font-size: 1.3em;
  cursor: pointer;
}

.winner-screen {
  text-align: center;
  padding: 20px;
}

.winner-screen h2 {
  font-family: 'Syne', sans-serif;
  font-size: 1.8em;
  margin-bottom: 20px;
}

.winner-screen h2 strong {
  color: var(--neon-yellow);
}

.final-scores {
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 1.1em;
  color: var(--text-dim);
}

.final-scores strong {
  font-family: 'Ubuntu Mono', monospace;
  color: #fff;
}
</style>
</head>
<body>

<div id="track-name-popup"></div>
<div id="score-notification" class="score-notification"></div>
<div id="action-notification" class="action-notification"></div>

<div class="container">
  <div class="header">
    <h1><i class="fas fa-bolt"></i> Revers Quiz</h1>
    <div class="subtitle">Угадай трек наоборот</div>
  </div>

  <div class="section">
    <h2 class="section-title"><i class="fas fa-users"></i> Команды</h2>
    <div class="team-input">
      <input type="text" id="team1" placeholder="Команда 1" value="Команда А" />
      <input type="text" id="team2" placeholder="Команда 2" value="Команда Б" />
      <button onclick="setTeams()">Сохранить команды</button>
    </div>
  </div>

  <div class="section" id="folder-section">
    <h2 class="section-title"><i class="fas fa-folder"></i> Категория</h2>
    <select id="folder-select" onchange="saveState()">
      <option value="">-- Выберите категорию --</option>
      <option value="/Зарубежные">🎵 Зарубежные</option>
      <option value="/Русские">🇷🇺 Русские</option>
    </select>
  </div>

  <div class="section">
    <button id="load-songs-btn" onclick="loadFiles()">
      <i class="fas fa-cloud-download-alt"></i> Загрузить треки
    </button>
  </div>

  <div class="section">
    <button id="shuffle-btn" onclick="shuffleTracks()">
      <i class="fas fa-random"></i> Перемешать
    </button>
  </div>

  <div id="quiz-area" style="display: none;">
    <div class="section">
      <h2 class="section-title"><i class="fas fa-trophy"></i> Счёт игры</h2>
      <div class="score-controls">
        <div class="score-team-group" id="score-group-1" onclick="manualActivateTeam(1)">
          <div class="score-team-header">
            <div class="score-team-label" id="team1-label">Команда А</div>
            <div class="score-display" id="score1">0</div>
          </div>
          <div class="score-btn-row remove">
            <button class="btn remove" onclick="event.stopPropagation(); removeScore(1, 0.5)">-0.5</button>
            <button class="btn remove" onclick="event.stopPropagation(); removeScore(1, 1)">-1</button>
            <button class="btn remove" onclick="event.stopPropagation(); removeScore(1, 2)">-2</button>
          </div>
          <div class="score-btn-row add">
            <button class="btn add" onclick="event.stopPropagation(); addScore(1, 0.5)">+0.5</button>
            <button class="btn add" onclick="event.stopPropagation(); addScore(1, 1)">+1</button>
            <button class="btn add" onclick="event.stopPropagation(); addScore(1, 2)">+2</button>
          </div>
        </div>

        <div class="score-team-group" id="score-group-2" onclick="manualActivateTeam(2)">
          <div class="score-team-header">
            <div class="score-team-label" id="team2-label">Команда Б</div>
            <div class="score-display" id="score2">0</div>
          </div>
          <div class="score-btn-row remove">
            <button class="btn remove" onclick="event.stopPropagation(); removeScore(2, 0.5)">-0.5</button>
            <button class="btn remove" onclick="event.stopPropagation(); removeScore(2, 1)">-1</button>
            <button class="btn remove" onclick="event.stopPropagation(); removeScore(2, 2)">-2</button>
          </div>
          <div class="score-btn-row add">
            <button class="btn add" onclick="event.stopPropagation(); addScore(2, 0.5)">+0.5</button>
            <button class="btn add" onclick="event.stopPropagation(); addScore(2, 1)">+1</button>
            <button class="btn add" onclick="event.stopPropagation(); addScore(2, 2)">+2</button>
          </div>
        </div>
      </div>

      <div class="result-sounds">
        <button class="result-btn winner" onclick="playSound('winner')">
          <i class="fas fa-check"></i> Правильно
        </button>
        <button class="result-btn lost" onclick="playSound('lost')">
          <i class="fas fa-times"></i> Мимо
        </button>
      </div>
    </div>

    <div class="section">
      <h2 class="section-title">
        <i class="fas fa-play"></i> Плеер
        <span style="font-size:0.8em; color:var(--neon-yellow); margin-left:6px;">
          (Осталось: <span id="track-counter">0</span>)
        </span>
      </h2>

      <div class="player-container">
        <div class="player-label"><i class="fas fa-backward"></i> Реверс трек</div>
        <div class="player-controls">
          <button class="play-btn" onclick="toggleRevers()">
            <i class="fas fa-play" id="revers-play-icon"></i>
          </button>
          <div class="progress-bar" id="revers-progress-bar" onclick="seekRevers(event)">
            <div class="progress-bar-fill" id="revers-progress-fill"></div>
          </div>
          <div class="time-info">
            <span id="revers-current-time">00:00</span> / <span id="revers-duration">00:00</span>
          </div>
        </div>
      </div>

async function fetchFolderFiles(path) {

    while (true) {

      const response = await fetch(url);[cite: 2]

      const data = await response.json();[cite: 2]
      const items = data._embedded?.items;[cite: 2]
      if (!items || items.length === 0) break;[cite: 2]
      allItems.push(...items);[cite: 2]
      if (items.length < limit) break;[cite: 2]
      offset += limit;[cite: 2]
    }
    const mp3Files = allItems.filter(f => f.name?.toLowerCase().endsWith('.mp3'));[cite: 2]
    mp3Files.forEach(file => {
      const cleanName = file.name.replace(/_(REVERS|NORMAL)\.mp3$/i, "");[cite: 2]
      if (!files[cleanName]) files[cleanName] = {};[cite: 2]
      if (file.name.includes("_REVERS")) files[cleanName].revers = file.file;[cite: 2]
      if (file.name.includes("_NORMAL")) files[cleanName].normal = file.file;[cite: 2]
    });
    return files;[cite: 2]
  } catch (e) {
    console.error("Ошибка загрузки папки:", e);[cite: 2]
    return {};[cite: 2]
  }
}

  const b = document.getElementById("normal-toggle");[cite: 2]
  p.style.display = p.style.display === "none" ? "block" : "none";[cite: 2]
  b.textContent = p.style.display === "none" ? "Показать оригинал" : "Скрыть оригинал";[cite: 2]
  if (p.style.display === "none") document.getElementById("audio-normal").pause();[cite: 2]
}

function hideOriginal() {
  const p = document.getElementById("original-player");[cite: 2]
  p.style.display = "none";[cite: 2]
  document.getElementById("normal-toggle").textContent = "Показать оригинал";[cite: 2]
  document.getElementById("audio-normal").pause();[cite: 2]
  document.getElementById("normal-play-icon").classList.replace("fa-pause", "fa-play");[cite: 2]
}

function toggleNormal() {
  initAudio();
  const a = document.getElementById("audio-normal");[cite: 2]
  const r = document.getElementById("audio-revers");[cite: 2]
  const i = document.getElementById("normal-play-icon");[cite: 2]
  if (a.paused) {
    stopTimer();[cite: 2]
    r.pause();[cite: 2]
    document.getElementById("revers-play-icon").classList.replace("fa-pause", "fa-play");[cite: 2]
    a.src = files[currentTrackName]?.normal;[cite: 2]
    a.load();[cite: 2]
    a.play().then(() => {
      i.classList.replace("fa-play", "fa-pause");[cite: 2]
      updateNormalProgress();[cite: 2]
    }).catch(err => {
      console.warn("Воспроизведение оригинала заблокировано:", err);
    });
    a.onloadedmetadata = () => {
      document.getElementById("normal-duration").textContent = formatTime(a.duration);[cite: 2]
    };
  } else {
    a.pause();[cite: 2]
    i.classList.replace("fa-pause", "fa-play");[cite: 2]
  }
}

function updateReversProgress() {
  const a = document.getElementById("audio-revers");[cite: 2]
  const fill = document.getElementById("revers-progress-fill");[cite: 2]
  const currentTimeEl = document.getElementById("revers-current-time");[cite: 2]
  const duration = isNaN(a.duration) ? 0 : a.duration;[cite: 2]
  const progress = a.currentTime / duration;[cite: 2]
  fill.style.width = `${progress * 100 || 0}%`;[cite: 2]
  currentTimeEl.textContent = formatTime(a.currentTime);[cite: 2]
  if (!a.paused) requestAnimationFrame(updateReversProgress);[cite: 2]
}

function updateNormalProgress() {
  const a = document.getElementById("audio-normal");[cite: 2]
  const fill = document.getElementById("normal-progress-fill");[cite: 2]
  const currentTimeEl = document.getElementById("normal-current-time");[cite: 2]
  const duration = isNaN(a.duration) ? 0 : a.duration;[cite: 2]
  const progress = a.currentTime / duration;[cite: 2]
  fill.style.width = `${progress * 100 || 0}%`;[cite: 2]
  currentTimeEl.textContent = formatTime(a.currentTime);[cite: 2]
  if (!a.paused) requestAnimationFrame(updateNormalProgress);[cite: 2]
}

function seekRevers(e) {
  const bar = document.getElementById("revers-progress-bar");[cite: 2]
  const audio = document.getElementById("audio-revers");[cite: 2]
  const percent = e.offsetX / bar.offsetWidth;[cite: 2]
  audio.currentTime = percent * audio.duration;[cite: 2]
}

function seekNormal(e) {
  const bar = document.getElementById("normal-progress-bar");[cite: 2]
  const audio = document.getElementById("audio-normal");[cite: 2]
  const percent = e.offsetX / bar.offsetWidth;[cite: 2]
  audio.currentTime = percent * audio.duration;[cite: 2]
}

function markAsPlayed() {
  if (currentTrackName && !playedTracks.has(currentTrackName)) {
    playedTracks.add(currentTrackName);[cite: 2]
    updateTrackCounter();[cite: 2]
    saveState();[cite: 2]
    document.querySelectorAll(`[data-song="${currentTrackName}"]`).forEach(btn => {
      btn.classList.add("played");[cite: 2]
      btn.disabled = true;[cite: 2]
    });
    updateNextTrackButton();[cite: 2]
  }
}

document.getElementById("audio-revers").addEventListener("playing", markAsPlayed);[cite: 2]

function showNotification(text, isAddition = true) {
  const notif = document.getElementById("score-notification");[cite: 2]
  notif.innerHTML = text;[cite: 2]
  notif.style.color = isAddition ? 'var(--neon-lime)' : 'var(--neon-pink)';[cite: 2]
  notif.style.borderColor = isAddition ? 'var(--neon-lime)' : 'var(--neon-pink)';[cite: 2]
  notif.classList.add("show");[cite: 2]
  setTimeout(() => {
    notif.classList.remove("show");[cite: 2]
  }, 1200);[cite: 2]
}

function addScore(team, points) {
  if (team === 1) score1 += points;[cite: 2]
  else if (team === 2) score2 += points;[cite: 2]
  document.getElementById("score1").textContent = score1.toFixed(1);[cite: 2]
  document.getElementById("score2").textContent = score2.toFixed(1);[cite: 2]
  saveState();[cite: 2]
  playRingScore();[cite: 2]
  showNotification(`+${points} (${team === 1 ? team1Name : team2Name})`, true);[cite: 2]
}

function removeScore(team, points) {
  if (team === 1) score1 = Math.max(0, score1 - points);[cite: 2]
  else if (team === 2) score2 = Math.max(0, score2 - points);[cite: 2]
  document.getElementById("score1").textContent = score1.toFixed(1);[cite: 2]
  document.getElementById("score2").textContent = score2.toFixed(1);[cite: 2]
  saveState();[cite: 2]
  showNotification(`-${points} (${team === 1 ? team1Name : team2Name})`, false);[cite: 2]
}

function stopAllSounds() {
  ["audio-revers", "audio-normal"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.pause();
  });
  stopTimer();[cite: 2]
}

function updateTrackCounter() {
  document.getElementById("track-counter").textContent = Object.keys(files).length - playedTracks.size;[cite: 2]
  updateNextTrackButton();[cite: 2]
}

function saveState() {
  localStorage.setItem('reversQuiz', JSON.stringify({
    team1: team1Name,[cite: 2]
    team2: team2Name,[cite: 2]
    score1, score2,[cite: 2]
    playedTracks: Array.from(playedTracks),[cite: 2]
    selectedFolder,[cite: 2]
    timerDuration,[cite: 2]
    mixMode,[cite: 2]
    activeTeam,[cite: 2]
    shouldAutoSwitch,[cite: 2]
    lastPlayedTrack,[cite: 2]
    trackOrder[cite: 2]
  }));[cite: 2]
}

function endQuiz() {
  localStorage.removeItem('reversQuiz');[cite: 2]
  stopAllSounds();[cite: 2]
  const quizArea = document.getElementById("quiz-area");[cite: 2]
  quizArea.innerHTML = '';[cite: 2]
  const resultDiv = document.createElement('div');[cite: 2]
  resultDiv.className = 'winner-screen';[cite: 2]
  resultDiv.innerHTML = `
    <h2>🏆 Итоги битвы:<br><strong>${score1 > score2 ? team1Name : score2 > score1 ? team2Name : "Ничья!"}</strong></h2>
    <div class="final-scores">
      <div>${team1Name}: <strong>${score1.toFixed(1)}</strong></div>
      <div>${team2Name}: <strong>${score2.toFixed(1)}</strong></div>
    </div>
  `;[cite: 2]
  quizArea.appendChild(resultDiv);[cite: 2]
  const restartBtn = document.createElement("button");[cite: 2]
  restartBtn.innerHTML = '<i class="fas fa-redo"></i> Новая игра';[cite: 2]
  restartBtn.style.cssText = `
    width: 100%;
    padding: 16px;
    margin-top: 24px;
    background: var(--neon-cyan);
    color: #000;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 1px;
  `;[cite: 2]
  restartBtn.onclick = () => location.reload();[cite: 2]
  quizArea.appendChild(restartBtn);[cite: 2]
}

function openSettings() {
  document.getElementById("timer-input").value = timerDuration;[cite: 2]
  document.getElementById("mix-mode").value = mixMode ? "mixed" : "normal";[cite: 2]
  document.getElementById("settings-modal").classList.add("active");[cite: 2]
}

function closeSettings() {
  document.getElementById("settings-modal").classList.remove("active");[cite: 2]
}

function setSettings() {
  const input = document.getElementById("timer-input");[cite: 2]
  const mode = document.getElementById("mix-mode").value;[cite: 2]
  const value = parseInt(input.value);[cite: 2]
  if (isNaN(value) || value < 1 || value > 300) return alert("Таймер: от 1 до 300 сек.");[cite: 2]
  timerDuration = value;[cite: 2]
  mixMode = mode === "mixed";[cite: 2]
  closeSettings();[cite: 2]
  updateFolderSection();[cite: 2]
  saveState();[cite: 2]
  showActionNotification('⚙️ Настройки применены');[cite: 2]
}

function startTimer() {
  if (isTimerActive) return;[cite: 2]
  isTimerActive = true;[cite: 2]
  timerValue = timerDuration;[cite: 2]
  document.getElementById("timer-circle").classList.add("active");[cite: 2]
  updateTimerDisplay();[cite: 2]
  playTimeStart();[cite: 2]
  timerInterval = setInterval(() => {
    timerValue--;[cite: 2]
    updateTimerDisplay();[cite: 2]
    if (timerValue === 1) {
      crossfadeToFinal();[cite: 2]
    }
    if (timerValue <= 0) {
      clearInterval(timerInterval);[cite: 2]
      timerInterval = null;[cite: 2]
    }
  }, 1000);[cite: 2]
}

function stopTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);[cite: 2]
    timerInterval = null;[cite: 2]
  }
  isTimerActive = false;[cite: 2]
  document.getElementById("timer-circle").classList.remove("active");[cite: 2]
  stopCurrentTimerSounds();[cite: 2]
}

function updateTimerDisplay() {
  const el = document.getElementById("timer-circle");[cite: 2]
  el.textContent = timerValue;[cite: 2]
  const isUrgent = timerValue <= 5;[cite: 2]
  el.style.borderColor = isUrgent ? "var(--neon-pink)" : "var(--neon-cyan)";[cite: 2]
  el.style.color = isUrgent ? "var(--neon-pink)" : "var(--neon-cyan)";[cite: 2]
  el.style.boxShadow = isUrgent ? "0 0 20px rgba(255, 0, 85, 0.5)" : "0 0 20px rgba(0, 229, 255, 0.4)";[cite: 2]
}
</script>
