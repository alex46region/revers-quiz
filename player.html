<!-- Запрет кэширования браузером старых файлов -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<title>⚡ Revers Quiz — Экран команды</title>

<!-- Скрипт автоматического сброса кэша при обновлении версии -->
<script>
(async function checkClientVersionAndClearCache() {
  try {
    var res = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return;
    var data = await res.json();
    var remoteVer = parseInt(data.nativeVersion) || 0;
    var localVer = parseInt(localStorage.getItem("player_app_version")) || 0;

    if (remoteVer > localVer) {
      localStorage.setItem("player_app_version", remoteVer);
      
      // Очистка Cache Storage
      if ("caches" in window) {
        var keys = await caches.keys();
        await Promise.all(keys.map(function(k) { return caches.delete(k); }));
      }
      
      // Обновление Service Worker
      if ("serviceWorker" in navigator) {
        var regs = await navigator.serviceWorker.getRegistrations();
        for (var reg of regs) {
          await reg.update();
        }
      }
      
      // Мгновенная перезагрузка без кэша
      window.location.reload(true);
    }
  } catch(e) {
    console.warn("Проверка версии пропущена:", e);
  }
})();
</script>

<style>
:root {
  --bg-deep: #030407;
  --bg-card: rgba(14, 18, 26, 0.75);
  --neon-cyan: #00f0ff;
  --neon-pink: #ff0055;
  --neon-yellow: #ffe600;
  --neon-lime: #00ff66;
  --neon-purple: #7000ff;
  --text-pure: #ffffff;
  --text-dim: #7d8ea6;
  --border-glow: rgba(0, 240, 255, 0.2);
  --border-subtle: rgba(255, 255, 255, 0.08);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Space Grotesk', sans-serif;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

body {
  background-color: var(--bg-deep);
  background-image: 
    radial-gradient(circle at 50% 10%, rgba(0, 240, 255, 0.12) 0%, transparent 50%),
    radial-gradient(circle at 10% 90%, rgba(112, 0, 255, 0.12) 0%, transparent 50%),
    radial-gradient(circle at 90% 90%, rgba(255, 0, 85, 0.12) 0%, transparent 50%);
  color: var(--text-pure);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: 14px;
  overflow: hidden;
  position: relative;
}

/* Анимация изменения счёта */
.score-delta-overlay {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.5);
  z-index: 10000;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.score-delta-overlay.show {
  display: flex;
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

.score-delta-badge {
  font-family: 'Ubuntu Mono', monospace;
  font-size: clamp(3.6em, 13vw, 5.5em);
  font-weight: 800;
  padding: 12px 36px;
  border-radius: 30px;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.score-delta-overlay.show .score-delta-badge {
  animation: scoreBadgeShake 1.6s infinite ease-in-out;
}

@keyframes scoreBadgeShake {
  0% { transform: rotate(0deg) scale(1); }
  20% { transform: rotate(-7deg) scale(1.08); }
  40% { transform: rotate(6deg) scale(1.14); }
  60% { transform: rotate(-4deg) scale(1.08); }
  80% { transform: rotate(3deg) scale(1.04); }
  100% { transform: rotate(0deg) scale(1); }
}

.score-delta-badge.plus {
  color: var(--neon-lime);
  border: 2px solid var(--neon-lime);
  background: rgba(0, 255, 102, 0.16);
  box-shadow: 
    0 0 40px rgba(0, 255, 102, 0.6),
    0 0 80px rgba(0, 255, 102, 0.3),
    inset 0 0 25px rgba(0, 255, 102, 0.25);
  text-shadow: 0 0 20px rgba(0, 255, 102, 0.8);
}

.score-delta-badge.minus {
  color: var(--neon-pink);
  border: 2px solid var(--neon-pink);
  background: rgba(255, 0, 85, 0.16);
  box-shadow: 
    0 0 40px rgba(255, 0, 85, 0.6),
    0 0 80px rgba(255, 0, 85, 0.3),
    inset 0 0 25px rgba(255, 0, 85, 0.25);
  text-shadow: 0 0 20px rgba(255, 0, 85, 0.8);
}

.score-delta-subtext {
  font-size: 0.9em;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: #fff;
  margin-top: 10px;
  text-shadow: 0 2px 10px rgba(0,0,0,0.8);
}

.login-wrap {
  margin: auto;
  width: 100%;
  max-width: 380px;
  background: var(--bg-card);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border-glow);
  border-radius: 28px;
  padding: 32px 24px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 240, 255, 0.1);
  animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

.brand-icon {
  width: 58px;
  height: 58px;
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 14px;
  font-size: 1.6em;
  color: #000;
  box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
}

.login-wrap h2 {
  font-family: 'Syne', sans-serif;
  font-size: 1.7em;
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}

.login-wrap p {
  color: var(--text-dim);
  font-size: 0.85em;
  margin-bottom: 22px;
  line-height: 1.4;
}

.input-box {
  margin-bottom: 12px;
}

.input-box input {
  width: 100%;
  padding: 15px 16px;
  background: rgba(5, 6, 10, 0.8);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  color: #fff;
  font-size: 17px;
  font-weight: 700;
  text-align: center;

}

.input-box input:focus {
  border-color: var(--neon-cyan);
  box-shadow: 0 0 20px rgba(0, 240, 255, 0.25);
}

.btn-join {
  width: 100%;
  padding: 16px;
  margin-top: 6px;
  background: linear-gradient(90deg, var(--neon-cyan), #00aaff);
  color: #000;
  border: none;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  cursor: pointer;
  box-shadow: 0 6px 25px rgba(0, 240, 255, 0.35);
}

.btn-join:active {
  transform: scale(0.98);
}

.error-banner {
  color: var(--neon-pink);
  background: rgba(255, 0, 85, 0.1);
  border: 1px solid rgba(255, 0, 85, 0.3);
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 0.85em;
  font-weight: 700;
  margin-top: 14px;
  display: none;
}

#game-view {
  display: none;
  flex-direction: column;
  flex: 1;
  max-width: 480px;
  width: 100%;
  margin: 0 auto;
  justify-content: space-between;
}

.top-action-bar {
  display: flex;
  gap: 8px;
  align-items: stretch;
  margin-bottom: 10px;
}

.scoreboard-arena {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(75px, 1fr));
  gap: 6px;
  flex: 1;
}

.player-chat-trigger-btn {
  background: var(--bg-card);
  border: 1px solid var(--neon-cyan);
  color: var(--neon-cyan);
  border-radius: 14px;
  padding: 0 14px;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 1.2em;
  position: relative;
  cursor: pointer;
  box-shadow: 0 0 15px rgba(0, 229, 255, 0.15);
  flex-shrink: 0;
  transition: all 0.2s ease;
}

.player-chat-trigger-btn.disabled {

  filter: grayscale(1);
  border-color: rgba(255, 255, 255, 0.2);
  color: var(--text-dim);
}

.player-chat-trigger-btn.has-pulse {
  animation: chatButtonGlowPulse 1.4s infinite alternate;
}

@keyframes chatButtonGlowPulse {
  0% {
    box-shadow: 0 0 15px rgba(0, 229, 255, 0.6), 0 0 30px rgba(0, 229, 255, 0.3);
    transform: scale(1);
  }
  100% {
    box-shadow: 0 0 35px var(--neon-pink), 0 0 60px rgba(255, 0, 85, 0.6);
    transform: scale(1.08);
  }
}

.player-chat-unread-badge {
  position: absolute;
  top: -4px;
  right: -4px;
  background: var(--neon-pink);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  padding: 2px 6px;
  border-radius: 10px;
  box-shadow: 0 0 8px rgba(255, 0, 85, 0.6);
  display: none;
}

.score-card {
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 6px 4px;
  text-align: center;
  transition: all 0.2s;
  min-width: 0;
}

.score-card.my-card {
  border-color: var(--neon-cyan);

  box-shadow: 0 0 14px rgba(0, 240, 255, 0.2);
}

.score-card.opponent-card {

  background: rgba(255, 0, 85, 0.03);
}

.score-team-title {
  font-size: 0.68em;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding: 0 2px;
}

.my-card .score-team-title {
  color: var(--neon-cyan);
}

.score-team-pts {
  font-family: 'Ubuntu Mono', monospace;
  font-size: 1.45em;
  font-weight: 700;
  line-height: 1.1;
  margin-top: 2px;
}

.my-card .score-team-pts {
  color: var(--neon-cyan);
  text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
}

.opponent-card .score-team-pts {
  color: var(--neon-pink);
}

.player-status-wrapper {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.status-pill {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  padding: 8px 14px;
  text-align: center;
  font-size: 0.85em;
  font-weight: 700;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.status-pill.playing {
  border-color: var(--neon-yellow);
  color: var(--neon-yellow);
  box-shadow: 0 0 15px rgba(255, 230, 0, 0.15);
}

.track-timer-bar {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.progress-track {
  flex: 1;
  height: 6px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 4px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--neon-cyan);
  box-shadow: 0 0 8px var(--neon-cyan);
  width: 0%;
  transition: width 0.1s linear;
}

.track-time-text {
  font-family: 'Ubuntu Mono', monospace;
  font-size: 0.85em;
  color: var(--neon-yellow);
  min-width: 80px;
  text-align: right;
  font-weight: 700;
}

.revealed-track-box {
  background: linear-gradient(135deg, rgba(0, 255, 102, 0.12) 0%, rgba(0, 229, 255, 0.08) 100%);
  border: 1px solid var(--neon-lime);
  border-radius: 16px;
  padding: 12px 14px;
  margin-top: 4px;
  display: none;
  align-items: flex-start;
  gap: 12px;
  box-shadow: 
    0 8px 30px rgba(0, 0, 0, 0.7),
    0 0 25px rgba(0, 255, 102, 0.25),
    inset 0 0 15px rgba(0, 255, 102, 0.1);
  position: relative;
  overflow: hidden;
  max-width: 100%;
}

.revealed-track-box.active-reveal {
  display: flex;
  animation: revealPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes revealPop {
  0% { transform: translateY(12px) scale(0.96); opacity: 0; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}

.revealed-track-box::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 60%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
  animation: shineSweep 2.2s infinite;
  pointer-events: none;
}

@keyframes shineSweep {
  0% { left: -100%; }
  60%, 100% { left: 160%; }
}

.track-equalizer-bars {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 20px;
  flex-shrink: 0;
  align-self: flex-start;
  margin-top: 3px;
}

.eq-bar {
  width: 3px;
  background: var(--neon-lime);
  border-radius: 2px;
  box-shadow: 0 0 6px var(--neon-lime);
}

.eq-bar:nth-child(1) { height: 40%; animation: eqBounce1 0.7s infinite alternate ease-in-out; }
.eq-bar:nth-child(2) { height: 80%; animation: eqBounce2 0.5s infinite alternate ease-in-out; }
.eq-bar:nth-child(3) { height: 60%; animation: eqBounce3 0.8s infinite alternate ease-in-out; }
.eq-bar:nth-child(4) { height: 90%; animation: eqBounce1 0.6s infinite alternate ease-in-out; }

@keyframes eqBounce1 { 0% { height: 25%; } 100% { height: 95%; } }
@keyframes eqBounce2 { 0% { height: 85%; } 100% { height: 30%; } }
@keyframes eqBounce3 { 0% { height: 40%; } 100% { height: 100%; } }

.reveal-content-meta {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.reveal-label-sub {
  font-size: 0.68em;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--neon-lime);
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}

.reveal-song-title {
  font-size: clamp(0.85em, 2.8vw, 1.1em);
  font-weight: 800;
  color: #fff;
  white-space: normal;
  word-break: break-word;
  overflow-wrap: anywhere;
  line-height: 1.25;
  text-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
}

.buzzer-stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  gap: 16px;
  padding: 8px 0;
}

.buzzer-halo {
  position: relative;
  border-radius: 50%;
  padding: 12px;
  background: radial-gradient(circle, rgba(255, 0, 85, 0.15) 0%, transparent 70%);
}

.buzzer-3d-btn {

  height: 220px;
  border-radius: 50%;
  border: 4px solid rgba(255, 255, 255, 0.15);
  background: radial-gradient(circle at 35% 35%, #ff2a70, #c40042 60%, #700024 100%);
  color: #fff;
  font-family: 'Syne', sans-serif;
  font-size: 1.7em;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 2px;
  cursor: pointer;
  box-shadow: 0 15px 35px rgba(255, 0, 85, 0.4), 0 0 50px rgba(255, 0, 85, 0.25);
  transition: all 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.buzzer-3d-btn:active:not(:disabled) {
  transform: scale(0.92) translateY(6px);
  box-shadow: 0 5px 15px rgba(255, 0, 85, 0.5);
}

.buzzer-3d-btn:disabled {
  background: radial-gradient(circle, #252a36 0%, #151821 100%);
  border-color: rgba(255, 255, 255, 0.05);
  color: #4a5468;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none;
}

.buzzer-3d-btn.winner-turn {
  background: radial-gradient(circle at 35% 35%, #2eff84, #00bd4c 60%, #006b2b 100%);
  box-shadow: 0 0 70px rgba(0, 255, 102, 0.7), inset 0 4px 10px rgba(255, 255, 255, 0.6);
  color: #000;
  animation: pulseTurn 0.8s infinite alternate;
}

@keyframes pulseTurn {
  0% { transform: scale(0.97); }
  100% { transform: scale(1.03); }
}

.pass-turn-btn {
  background: rgba(255, 230, 0, 0.08);
  border: 1px solid var(--neon-yellow);
  color: var(--neon-yellow);
  padding: 10px 22px;
  border-radius: 12px;
  font-weight: 800;
  font-size: 0.85em;
  text-transform: uppercase;
  letter-spacing: 1px;
  cursor: pointer;
  display: none;
  animation: fadeIn 0.3s;
}

.pass-turn-btn:active {
  background: var(--neon-yellow);
  color: #000;
}

.hud-footer {
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  padding: 12px;
  text-align: center;
  font-size: 0.9em;
  color: var(--text-dim);
}

.hud-footer strong {
  color: #fff;
}

#game-over-view {
  display: none;
  flex-direction: column;
  margin: auto;
  width: 100%;
  max-width: 400px;
  background: var(--bg-card);
  backdrop-filter: blur(20px);
  border: 1px solid var(--neon-yellow);
  box-shadow: 0 0 50px rgba(255, 230, 0, 0.2);
  border-radius: 28px;
  padding: 28px 20px;
  text-align: center;
  animation: fadeIn 0.4s ease;
}

.trophy-icon {
  font-size: 3em;
  color: var(--neon-yellow);
  filter: drop-shadow(0 0 18px var(--neon-yellow));
  margin-bottom: 10px;
}

.game-over-title {
  font-family: 'Syne', sans-serif;
  font-size: 1.8em;
  margin-bottom: 4px;
}

.winner-name-badge {
  font-size: 1.3em;
  font-weight: 800;
  color: var(--neon-lime);
  margin-bottom: 16px;
  text-shadow: 0 0 15px rgba(0, 255, 102, 0.5);
}

.final-leaderboard {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 20px;
  text-align: left;
}

.leaderboard-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(5, 6, 10, 0.8);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 0.95em;
  font-weight: 700;
}

.leaderboard-row.gold {
  border-color: var(--neon-yellow);
  background: rgba(255, 230, 0, 0.08);
}

.leaderboard-row .pts {
  font-family: 'Ubuntu Mono', monospace;
  font-size: 1.2em;
  color: var(--neon-cyan);
}

.countdown-box {
  font-size: 0.85em;
  color: var(--text-dim);
}

.countdown-box span {
  font-family: 'Ubuntu Mono', monospace;
  font-weight: 700;
  color: var(--neon-pink);
  font-size: 1.2em;
}

#player-chat-modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(10px);
  z-index: 3000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 14px;
}

.player-chat-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-glow);
  border-radius: 24px;
  width: 100%;

  height: 80vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
  position: relative;

.player-chat-head {
  padding: 14px 18px;
  background: var(--bg-elevated);

  justify-content: space-between;
  align-items: center;

.player-chat-messages {
  flex: 1;

<body>

<audio id="player-audio-revers" preload="auto" playsinline crossorigin="anonymous" style="display:none;"></audio>
<audio id="player-audio-normal" preload="auto" playsinline crossorigin="anonymous" style="display:none;"></audio>

<div class="score-delta-overlay" id="player-score-delta-popup">
  <div class="score-delta-badge plus" id="player-score-delta-badge">+1</div>
  <div class="score-delta-subtext">Баллы обновлены!</div>
</div>

<div class="login-wrap" id="login-view">
  <div class="brand-icon"><i class="fas fa-bolt"></i></div>
  <h2>Вход в игру</h2>
  <p>Введите PIN-код с экрана ведущего и назовите команду</p>
  
  <div class="input-box">
    <input type="number" id="room-pin" placeholder="PIN код" pattern="[0-9]*" />

  <div class="input-box">

  <button class="btn-join" onclick="joinGame()">Подключиться</button>
  <div class="error-banner" id="login-error"></div>

<div id="game-view">
  <div class="top-action-bar">
    <div class="scoreboard-arena" id="scoreboard-wrap"></div>
    <button class="player-chat-trigger-btn" id="player-chat-toggle-btn" onclick="togglePlayerChat()" title="Открыть чат">
      <i class="fas fa-comments"></i>
      <span class="player-chat-unread-badge" id="player-chat-unread">0</span>
    </button>
  </div>

  <div class="player-status-wrapper">
    <div class="status-pill" id="round-status-pill">
      <i class="fas fa-hourglass-half"></i> <span>Ожидание раунда</span>
    </div>

    <div class="track-timer-bar" id="player-timer-bar">
      <i class="fas fa-music" style="color:var(--neon-cyan); font-size:0.9em;"></i>
      <div class="progress-track">
        <div class="progress-fill" id="player-progress-fill"></div>
      </div>
      <div class="track-time-text" id="player-time-display">00:00 / 00:00</div>
    </div>

    <div class="revealed-track-box" id="revealed-track-box">
      <div class="track-equalizer-bars">
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
      </div>
      <div class="reveal-content-meta">
        <div class="reveal-label-sub">
          <i class="fas fa-compact-disc fa-spin"></i> Оригинальный трек
        </div>
        <div class="reveal-song-title" id="reveal-song-title-text">
          Название трека
        </div>
      </div>
    </div>
  </div>

  <div class="buzzer-stage">
    <div class="buzzer-halo">
      <button class="buzzer-3d-btn" id="buzzer-btn" disabled onclick="pressBuzzer()">
        <i class="fas fa-hand-paper" style="font-size:1.1em; margin-bottom:2px;"></i>
        <span>ЖДИ</span>
      </button>
    </div>
    <button class="pass-turn-btn" id="pass-btn" onclick="passTurn()">
      <i class="fas fa-forward"></i> Пас / Пропустить ход
    </button>
  </div>

  <div class="hud-footer" id="hud-footer">
    Ожидаем запуск раунда ведущим...
  </div>
</div>

<div id="game-over-view">
  <div class="trophy-icon"><i class="fas fa-trophy"></i></div>
  <div class="game-over-title">Итоги игры</div>
  <div class="winner-name-badge" id="winner-badge-text">Победитель!</div>
  
  <div class="final-leaderboard" id="final-leaderboard-list"></div>
  
  <div class="countdown-box">
    Возврат к вводу PIN через: <span id="reset-seconds">10</span> сек.
  </div>
</div>

<div id="player-chat-modal">
  <div class="player-chat-card">
    <div class="player-chat-head">
      <span><i class="fas fa-comment-dots" style="color:var(--neon-cyan);"></i> Чат игры</span>
      <i class="fas fa-times" onclick="togglePlayerChat()" style="cursor:pointer; color:var(--text-dim);"></i>
    </div>
    <div class="player-chat-messages" id="player-chat-messages"></div>
    
    <div class="player-emoji-popover" id="player-emoji-popover"></div>

    <div class="player-chat-input-bar">
      <button class="btn-player-emoji" onclick="togglePlayerEmojiPopover()">😊</button>
      <input type="text" id="player-chat-input" placeholder="Введите ваш ответ..." onkeydown="if(event.key==='Enter') sendPlayerChatMessage();" />
      <button class="btn-send-player" onclick="sendPlayerChatMessage()"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>
</div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyC9sh7uazv-WbudsO7TYap4-wENjkLD3K4",
  authDomain: "revers-quiz.firebaseapp.com",
  databaseURL: "https://revers-quiz-default-rtdb.firebaseio.com",
  projectId: "revers-quiz",
  storageBucket: "revers-quiz.firebasestorage.app",
  messagingSenderId: "940882425335",
  appId: "1:940882425335:web:bf3c52135d8a7cd7d9eaf2",
  measurementId: "G-93CJT9ZT4G"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();

var currentRoom = null;
var myTeamId = null;
var myTeamName = "";
var gameOverTimer = null;
var scoreDeltaTimer = null;
var currentLoadedReversUrl = "";
var currentTrackDuration = 0;
var progressAnimFrame = null;

var joinedTrackSessionId = null;
var hasWaitedForNewTrack = false;
var timerRunning = false;
var timerStartTime = 0;
var timerTotalDuration = 0;
var isStreamAudioAllowed = false;
var roomChatMode = "disabled";
var currentRoomStatus = "idle";
var canBuzzerAnswerNow = false;

var isChatOpen = false;
var unreadChatCount = 0;
var lastSeenScoreTimestamp = 0;

function playMessageNotificationSound() {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = "sine";
    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.35);
  } catch(e) {}
}

var POPULAR_EMOJIS = ["👍","👏","🔥","🎉","😂","😎","🤩","🤔","😮","🎵","🎶","🎤","🎧","🏆","⭐","💯","❤️","👋","🤐","🚀","💃"];

function initEmojiPicker(containerId, inputId) {
  var container = document.getElementById(containerId);
  if (!container) return;
  container.innerHTML = "";
  POPULAR_EMOJIS.forEach(function(em) {
    var s = document.createElement("span");
    s.textContent = em;
    s.onclick = function(e) {
      e.stopPropagation();
      var input = document.getElementById(inputId);
      input.value += em;
      input.focus();
    };
    container.appendChild(s);
  });
}

function togglePlayerEmojiPopover() {
  var p = document.getElementById("player-emoji-popover");
  p.style.display = p.style.display === "grid" ? "none" : "grid";
}

function formatTime(seconds) {
  seconds = Math.floor(seconds || 0);
  var mins = Math.floor(seconds / 60);
  var secs = seconds % 60;
  return String(mins).padStart(2, '0') + ":" + String(secs).padStart(2, '0');
}

function primeAudioElements() {
  ['player-audio-revers', 'player-audio-normal'].forEach(function(id) {
    var a = document.getElementById(id);
    if (a) {
      a.play().then(function() {
        a.pause();
      }).catch(function() {});
    }
  });
}

function showError(msg) {
  var err = document.getElementById("login-error");
  err.textContent = msg;
  err.style.display = "block";
}

function joinGame() {
  primeAudioElements();

  var pin = document.getElementById("room-pin").value.trim();
  var name = document.getElementById("team-name").value.trim();

  if (!pin) {
    showError("Введите PIN-код комнаты!");
    return;
  }
  if (!name) {
    showError("Укажите название вашей команды!");
    return;
  }

  showError("Подключение к комнате...");
  var roomRef = db.ref("rooms/" + pin);

  roomRef.once("value").then(function(snapshot) {
    if (!snapshot.exists()) {
      showError("❌ Комната с PIN " + pin + " не найдена. Проверьте код у ведущего!");
      return;
    }

    var currentData = snapshot.val();
    if (currentData && currentData.audioSync && currentData.audioSync.trackSessionId) {
      joinedTrackSessionId = currentData.audioSync.trackSessionId;
      hasWaitedForNewTrack = false;
    } else {
      hasWaitedForNewTrack = true;
    }

    currentRoom = pin;
    myTeamName = name;
    myTeamId = "team_" + Math.random().toString(36).substr(2, 6);

    roomRef.child("teams/" + myTeamId).set({
      name: myTeamName,
      ready: true,
      readyToPlay: false,
      score: 0
    });

    roomRef.child("teams/" + myTeamId).onDisconnect().remove();

    document.getElementById("login-view").style.display = "none";
    document.getElementById("game-view").style.display = "flex";

    initEmojiPicker("player-emoji-popover", "player-chat-input");
    listenToGameState();
    listenToAudioStream();
    listenToPlayerChat();
  }).catch(function(e) {
    showError("Ошибка подключения: " + e.message);
  });
}

function showScoreDeltaAnimation(delta) {
  var popup = document.getElementById("player-score-delta-popup");
  var badge = document.getElementById("player-score-delta-badge");
  if (!popup || !badge) return;

  var isPlus = delta > 0;
  badge.textContent = (isPlus ? "+" : "") + delta;
  badge.className = "score-delta-badge " + (isPlus ? "plus" : "minus");

  popup.style.display = "flex";
  popup.offsetHeight;
  popup.classList.add("show");

  if (scoreDeltaTimer) clearTimeout(scoreDeltaTimer);
  scoreDeltaTimer = setTimeout(function() {
    popup.classList.remove("show");
    setTimeout(function() {
      if (!popup.classList.contains("show")) popup.style.display = "none";
    }, 350);
  }, 2200);
}

function updateProgressDisplay(currentTime, totalDuration) {
  var fill = document.getElementById("player-progress-fill");
  var timeDisplay = document.getElementById("player-time-display");

  var dur = totalDuration || currentTrackDuration || 0;
  var cur = currentTime || 0;

  var pct = dur > 0 ? (cur / dur) * 100 : 0;
  fill.style.width = Math.min(100, Math.max(0, pct)) + "%";
  timeDisplay.textContent = formatTime(cur) + " / " + formatTime(dur);
}

function startSyntheticTimer(startFromSec, totalDur) {
  stopSyntheticTimer();
  timerRunning = true;
  timerStartTime = Date.now() - (startFromSec * 1000);
  timerTotalDuration = totalDur || currentTrackDuration || 0;

  function tick() {
    if (!timerRunning) return;
    var elapsed = (Date.now() - timerStartTime) / 1000;
    if (elapsed > timerTotalDuration) {
      elapsed = timerTotalDuration;
      timerRunning = false;
    }
    updateProgressDisplay(elapsed, timerTotalDuration);
    if (timerRunning) {
      progressAnimFrame = requestAnimationFrame(tick);
    }
  }
  tick();
}

function stopSyntheticTimer() {
  timerRunning = false;
  if (progressAnimFrame) cancelAnimationFrame(progressAnimFrame);
}

function listenToAudioStream() {
  var audioSyncRef = db.ref("rooms/" + currentRoom + "/audioSync");
  var aRevers = document.getElementById("player-audio-revers");
  var aNormal = document.getElementById("player-audio-normal");

  audioSyncRef.on("value", function(snapshot) {
    var sync = snapshot.val();
    if (!sync) return;

    if (!hasWaitedForNewTrack) {
      if (sync.trackSessionId === joinedTrackSessionId) {
        return;
      } else {
        hasWaitedForNewTrack = true;
      }
    }

    if (sync.duration) {
      currentTrackDuration = sync.duration;
      if (!timerRunning && sync.playAction !== "pause") {
        updateProgressDisplay(0, currentTrackDuration);
      }
    }

    if (sync.reversUrl && sync.reversUrl !== currentLoadedReversUrl) {
      currentLoadedReversUrl = sync.reversUrl;

      aRevers.src = sync.reversUrl;
      aRevers.load();

      if (sync.normalUrl) {
        aNormal.src = sync.normalUrl;
        aNormal.load();
      }

      aRevers.oncanplay = function() {
        if (currentRoom && myTeamId) {
          db.ref("rooms/" + currentRoom + "/teams/" + myTeamId + "/readyToPlay").set(true);
        }
        aRevers.oncanplay = null;
      };
    }

    if (sync.playAction === "play_revers" || sync.playAction === "play_timer") {
      aNormal.pause();
      var targetDelay = Math.max(0, (sync.startAt || Date.now()) - Date.now());
      var duration = sync.duration || currentTrackDuration || 0;

      setTimeout(function() {
        if (isStreamAudioAllowed && sync.playAction === "play_revers") {
          aRevers.currentTime = 0;
          aRevers.play().catch(function() {});
        } else {
          aRevers.pause();
        }
        startSyntheticTimer(0, duration);
      }, targetDelay);

    } else if (sync.playAction === "resume_revers" || sync.playAction === "resume_timer") {
      aNormal.pause();
      var resumeTime = sync.currentTime || 0;
      var resumeDelay = Math.max(0, (sync.startAt || Date.now()) - Date.now());
      var rDur = sync.duration || currentTrackDuration || 0;

      setTimeout(function() {
        if (isStreamAudioAllowed && sync.playAction === "resume_revers") {
          aRevers.currentTime = resumeTime;
          aRevers.play().catch(function() {});
        } else {
          aRevers.pause();
        }
        startSyntheticTimer(resumeTime, rDur);
      }, resumeDelay);

    } else if (sync.playAction === "pause") {
      aRevers.pause();
      aNormal.pause();
      stopSyntheticTimer();
      var pausedAt = typeof sync.currentTime !== 'undefined' ? sync.currentTime : aRevers.currentTime;
      updateProgressDisplay(pausedAt, currentTrackDuration);

    } else if (sync.playAction === "play_normal") {
      aRevers.pause();
      stopSyntheticTimer();
      var normDelay = Math.max(0, (sync.startAt || Date.now()) - Date.now());
      setTimeout(function() {
        if (isStreamAudioAllowed) {
          aNormal.currentTime = 0;
          aNormal.play().catch(function() {});
        }
      }, normDelay);

    } else if (sync.playAction === "stop") {
      aRevers.pause();
      aNormal.pause();
      aRevers.currentTime = 0;
      aNormal.currentTime = 0;
      stopSyntheticTimer();
      updateProgressDisplay(0, currentTrackDuration);
    }
  });
}

function listenToGameState() {
  var roomRef = db.ref("rooms/" + currentRoom);

  roomRef.on("value", function(snapshot) {
    var data = snapshot.val();
    if (!data) return;

    if (data.status === "game_over") {
      showGameOverScreen(data.leaderboard || []);
      return;
    }

    // Если ведущий обновил версию викторины — обновляем страницу участника
    if (data.appVersion && data.appVersion > (parseInt(localStorage.getItem("player_app_version")) || 0)) {
      localStorage.setItem("player_app_version", data.appVersion);
      if ("caches" in window) {
        caches.keys().then(function(keys) {
          Promise.all(keys.map(function(k) { return caches.delete(k); })).then(function() {
            location.reload(true);
          });
        });
      } else {
        location.reload(true);
      }
      return;
    }

    currentRoomStatus = data.status || "idle";
    roomChatMode = data.chatMode || "disabled";
    isStreamAudioAllowed = (data.streamAudio === true);

    if (data.status === "reveal" || data.status === "playing") {
      closePlayerChat();
    }

    if (!isStreamAudioAllowed) {
      var aR = document.getElementById("player-audio-revers");
      var aN = document.getElementById("player-audio-normal");
      if (aR && !aR.paused) aR.pause();
      if (aN && !aN.paused) aN.pause();
    }

    var buzzerBtn = document.getElementById("buzzer-btn");
    var passBtn = document.getElementById("pass-btn");
    var hudFooter = document.getElementById("hud-footer");
    var roundStatusPill = document.getElementById("round-status-pill");
    var trackBox = document.getElementById("revealed-track-box");
    var trackTitleText = document.getElementById("reveal-song-title-text");
    var scoreboardWrap = document.getElementById("scoreboard-wrap");

    var showMyScore = data.showScore !== false;
    var showOppScore = data.showOpponentScore !== false;

    var teams = data.teams || {};
    var teamKeys = Object.keys(teams);

    if (!showMyScore && !showOppScore) {
      scoreboardWrap.style.display = "none";
    } else {
      scoreboardWrap.style.display = "grid";
      scoreboardWrap.innerHTML = "";

      if (showMyScore && teams[myTeamId]) {
        var myCard = document.createElement("div");
        myCard.className = "score-card my-card";
        myCard.innerHTML = 
          '<div class="score-team-title">' + (teams[myTeamId].name || myTeamName) + ' (Вы)</div>' +
          '<div class="score-team-pts">' + (teams[myTeamId].score || 0) + '</div>';
        scoreboardWrap.appendChild(myCard);

        var myTeamData = teams[myTeamId];
        if (myTeamData.lastScoreChangeAt && myTeamData.lastScoreChangeAt > lastSeenScoreTimestamp) {
          lastSeenScoreTimestamp = myTeamData.lastScoreChangeAt;
          if (myTeamData.lastScoreDelta) {
            showScoreDeltaAnimation(myTeamData.lastScoreDelta);
          }
        }
      }

      if (showOppScore) {
        teamKeys.filter(function(k) { return k !== myTeamId; }).forEach(function(k) {
          var oppCard = document.createElement("div");
          oppCard.className = "score-card opponent-card";
          oppCard.innerHTML = 
            '<div class="score-team-title">' + (teams[k].name || "Соперник") + '</div>' +
            '<div class="score-team-pts">' + (teams[k].score || 0) + '</div>';
          scoreboardWrap.appendChild(oppCard);
        });
      }
    }

    if (!hasWaitedForNewTrack) {
      buzzerBtn.disabled = true;
      buzzerBtn.className = "buzzer-3d-btn";
      buzzerBtn.innerHTML = '<i class="fas fa-hourglass-start"></i><span>ЖДИ</span>';
      roundStatusPill.className = "status-pill";
      roundStatusPill.innerHTML = '<i class="fas fa-hourglass-start"></i> <span>Ожидание раунда</span>';
      trackBox.classList.remove("active-reveal");
      hudFooter.innerHTML = "Вы подключились посреди игры. Вход со следующего трека...";
      return;
    }

    var buzzer = data.buzzer || {};
    var passedBy = buzzer.passedBy || [];
    var haveIPassed = passedBy.indexOf(myTeamId) !== -1;

    canBuzzerAnswerNow = (buzzer.pressedBy === myTeamId);
    updateChatTriggerButtonState();

    if (data.status === "playing") {
      trackBox.classList.remove("active-reveal");
      roundStatusPill.className = "status-pill playing";
      roundStatusPill.innerHTML = '<i class="fas fa-volume-up"></i> <span>Трек играет!</span>';
      
      if (!buzzer.locked) {
        passBtn.style.display = "none";
        
        if (haveIPassed) {
          buzzerBtn.disabled = true;
          buzzerBtn.className = "buzzer-3d-btn";
          buzzerBtn.innerHTML = '<i class="fas fa-forward"></i><span>ПАС</span>';
          hudFooter.innerHTML = "Вы спасовали. Ожидаем соперников...";
        } else {
          buzzerBtn.disabled = false;
          buzzerBtn.className = "buzzer-3d-btn";
          buzzerBtn.innerHTML = '<i class="fas fa-bolt"></i><span>ЖМИ!</span>';
          hudFooter.innerHTML = "Слушай внимательно и нажимай быстрее!";
        }
      } else {
        if (buzzer.pressedBy === myTeamId) {
          buzzerBtn.disabled = true;
          buzzerBtn.className = "buzzer-3d-btn winner-turn";
          buzzerBtn.innerHTML = '<i class="fas fa-microphone"></i><span>ОТВЕТ!</span>';
          passBtn.style.display = "inline-flex";

          if (roomChatMode !== "disabled") {
            hudFooter.innerHTML = "🏆 <strong style='color:var(--neon-lime)'>Вы успели первым! Напишите ответ в чат:</strong>";
            if (!isChatOpen) {
              openPlayerChat();
            }
          } else {
            hudFooter.innerHTML = "🏆 <strong style='color:var(--neon-lime)'>Вы успели первым! Называйте трек ведущему!</strong>";
          }
        } else {
          passBtn.style.display = "none";
          buzzerBtn.disabled = true;
          buzzerBtn.className = "buzzer-3d-btn";
          buzzerBtn.innerHTML = '<i class="fas fa-lock"></i><span>БЛОК</span>';
          var fastTeam = buzzer.pressedByName || "Соперник";
          hudFooter.innerHTML = "⛔ <strong>" + fastTeam + "</strong> отвечает!";
        }
      }
    } else if (data.status === "reveal") {
      passBtn.style.display = "none";
      buzzerBtn.disabled = true;
      buzzerBtn.className = "buzzer-3d-btn";
      buzzerBtn.innerHTML = '<i class="fas fa-music"></i><span>ОТВЕТ</span>';
      roundStatusPill.className = "status-pill";
      roundStatusPill.innerHTML = '<i class="fas fa-check-circle"></i> <span>Раунд завершён</span>';
      hudFooter.innerHTML = "Звучит оригинальная версия трека.";
      
      if (data.revealedTrack) {
        trackTitleText.textContent = data.revealedTrack;
        trackBox.classList.add("active-reveal");
      }
    } else {
      passBtn.style.display = "none";
      buzzerBtn.disabled = true;
      buzzerBtn.className = "buzzer-3d-btn";
      buzzerBtn.innerHTML = '<i class="fas fa-hourglass-start"></i><span>ЖДИ</span>';
      roundStatusPill.className = "status-pill";
      roundStatusPill.innerHTML = '<i class="fas fa-hourglass-start"></i> <span>Подготовка</span>';
      trackBox.classList.remove("active-reveal");
      hudFooter.innerHTML = "Ведущий выбирает следующий трек...";
    }
  });
}

function updateChatTriggerButtonState() {
  var triggerBtn = document.getElementById("player-chat-toggle-btn");
  if (!triggerBtn) return;

  if (roomChatMode === "disabled") {
    triggerBtn.style.display = "none";
    closePlayerChat();
    return;
  }

  triggerBtn.style.display = "flex";

  var isRestrictedNow = (roomChatMode === "restricted" && currentRoomStatus === "playing" && !canBuzzerAnswerNow);

  if (isRestrictedNow) {
    triggerBtn.classList.add("disabled");
  } else {
    triggerBtn.classList.remove("disabled");
  }
}

function openPlayerChat() {
  if (roomChatMode === "disabled") return;
  var modal = document.getElementById("player-chat-modal");
  var triggerBtn = document.getElementById("player-chat-toggle-btn");
  isChatOpen = true;
  modal.style.display = "flex";

  unreadChatCount = 0;
  updatePlayerChatBadge();
  triggerBtn.classList.remove("has-pulse");

  var box = document.getElementById("player-chat-messages");
  box.scrollTop = box.scrollHeight;
  setTimeout(function() {
    document.getElementById("player-chat-input").focus();
  }, 150);
}

function closePlayerChat() {
  var modal = document.getElementById("player-chat-modal");
  isChatOpen = false;
  modal.style.display = "none";
  document.getElementById("player-emoji-popover").style.display = "none";
}

function togglePlayerChat() {
  if (roomChatMode === "disabled") return;

  if (roomChatMode === "restricted" && currentRoomStatus === "playing" && !canBuzzerAnswerNow) {
    return;
  }

  if (isChatOpen) {
    closePlayerChat();
  } else {
    openPlayerChat();
  }
}

function updatePlayerChatBadge() {
  var badge = document.getElementById("player-chat-unread");
  if (!badge) return;
  if (unreadChatCount > 0 && roomChatMode !== "disabled") {
    badge.textContent = unreadChatCount;
    badge.style.display = "inline-block";
  } else {
    badge.style.display = "none";
  }
}

function listenToPlayerChat() {
  if (!currentRoom) return;
  var chatRef = db.ref("rooms/" + currentRoom + "/chat");
  var msgBox = document.getElementById("player-chat-messages");
  var triggerBtn = document.getElementById("player-chat-toggle-btn");

  chatRef.limitToLast(50).on("child_added", function(snapshot) {
    var msg = snapshot.val();
    if (!msg) return;

    var row = document.createElement("div");
    var isMine = msg.teamId === myTeamId;
    row.className = "chat-msg" + 
      (isMine ? " mine" : "") + 
      (msg.isHost ? " host" : "") + 
      (msg.isSystem ? " system" : "");

    if (msg.isSystem) {
      row.innerHTML = '<div>🔔 ' + msg.text + '</div>';
    } else {
      row.innerHTML = 
        '<div class="name">' + msg.author + '</div>' +
        '<div class="text">' + msg.text + '</div>';
    }

    msgBox.appendChild(row);
    msgBox.scrollTop = msgBox.scrollHeight;

    if (!isChatOpen && !isMine && roomChatMode !== "disabled") {
      unreadChatCount++;
      updatePlayerChatBadge();
      triggerBtn.classList.add("has-pulse");

      if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
      playMessageNotificationSound();
    }
  });
}

function sendPlayerChatMessage() {
  if (roomChatMode === "disabled") return;
  var input = document.getElementById("player-chat-input");
  var text = input.value.trim();
  if (!text || !currentRoom) return;

  db.ref("rooms/" + currentRoom + "/chat").push({
    author: myTeamName,
    teamId: myTeamId,
    text: text,
    isHost: false,
    time: Date.now()
  });

  input.value = "";
  document.getElementById("player-emoji-popover").style.display = "none";
}

function showGameOverScreen(leaderboard) {
  if (gameOverTimer) return;

  var aRevers = document.getElementById("player-audio-revers");
  var aNormal = document.getElementById("player-audio-normal");
  if (aRevers) aRevers.pause();
  if (aNormal) aNormal.pause();
  stopSyntheticTimer();
  closePlayerChat();

  document.getElementById("game-view").style.display = "none";
  var overView = document.getElementById("game-over-view");
  overView.style.display = "flex";

  var winnerBadge = document.getElementById("winner-badge-text");
  var list = document.getElementById("final-leaderboard-list");
  list.innerHTML = "";

  if (leaderboard.length > 0) {
    var topScore = leaderboard[0].score;
    var winners = leaderboard.filter(function(t) { return t.score === topScore; });

    if (winners.length > 1) {
      winnerBadge.textContent = "🤝 Боевая ничья!";
    } else {
      winnerBadge.textContent = "🏆 " + winners[0].name + " побеждает!";
    }

    leaderboard.forEach(function(t, idx) {
      var row = document.createElement("div");
      row.className = "leaderboard-row" + (idx === 0 ? " gold" : "");
      row.innerHTML = 
        '<span>' + (idx === 0 ? '🥇 ' : (idx + 1) + '. ') + t.name + '</span>' +
        '<span class="pts">' + t.score + '</span>';
      list.appendChild(row);
    });
  }

  var timeLeft = 10;
  var secSpan = document.getElementById("reset-seconds");
  secSpan.textContent = timeLeft;

  gameOverTimer = setInterval(function() {
    timeLeft--;
    if (secSpan) secSpan.textContent = timeLeft;

    if (timeLeft <= 0) {
      clearInterval(gameOverTimer);
      gameOverTimer = null;
      window.location.reload();
    }
  }, 1000);
}

function pressBuzzer() {
  if (!currentRoom || !myTeamId) return;

  if (navigator.vibrate) navigator.vibrate([40]);

  var buzzerRef = db.ref("rooms/" + currentRoom + "/buzzer");
  
  buzzerRef.transaction(function(buzzer) {
    if (!buzzer) buzzer = {};
    if (buzzer.locked) return;
    
    var passed = buzzer.passedBy || [];
    if (passed.indexOf(myTeamId) !== -1) return;

    return {
      locked: true,
      pressedBy: myTeamId,
      pressedByName: myTeamName,
      passedBy: passed,
      time: Date.now()
    };
  }, function(error, committed) {
    if (committed && roomChatMode !== "disabled") {
      db.ref("rooms/" + currentRoom + "/chat").push({
        author: "Система",
        text: "⚡ " + myTeamName + " жмёт кнопку и отвечает!",
        isSystem: true,
        time: Date.now()
      });
    }
  });
}

function passTurn() {
  if (!currentRoom || !myTeamId) return;

  if (navigator.vibrate) navigator.vibrate([20, 30, 20]);

  var buzzerRef = db.ref("rooms/" + currentRoom + "/buzzer");
  
  buzzerRef.transaction(function(buzzer) {
    if (!buzzer || buzzer.pressedBy !== myTeamId) return;
    
    var passed = buzzer.passedBy || [];
    if (passed.indexOf(myTeamId) === -1) {
      passed.push(myTeamId);
    }

    return {
      locked: false,
      pressedBy: null,
      pressedByName: null,
      passedBy: passed,
      time: Date.now()
    };
  }, function(error, committed) {
    if (committed && roomChatMode !== "disabled") {
      db.ref("rooms/" + currentRoom + "/chat").push({
        author: "Система",
        text: "⏩ " + myTeamName + " пасует ход!",
        isSystem: true,
        time: Date.now()
      });
    }
  });
}
</script>
