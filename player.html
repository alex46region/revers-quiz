<title>⚡ Revers Quiz — Экран команды</title>
<script>
(async function checkClientVersionAndClearCache() {
try {
var res = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
if (!res.ok) return;
var data = await res.json();
var remoteVer = parseInt(data.nativeVersion) || 0;
var localVer = parseInt(localStorage.getItem("player_app_version")) || 0;
if (remoteVer > localVer) {
localStorage.setItem("player_app_version", remoteVer);
if ("caches" in window) {
var keys = await caches.keys();
await Promise.all(keys.map(function(k) { return caches.delete(k); }));
}
if ("serviceWorker" in navigator) {
var regs = await navigator.serviceWorker.getRegistrations();
for (var reg of regs) { await reg.update(); }
}
window.location.reload(true);
}
} catch(e) { console.warn("Проверка версии пропущена:", e); }
})();
</script>

async function enableScreenWakeLock() {
try {
if ('wakeLock' in navigator) {

function playJokerSound() {
try {
var ctx = new (window.AudioContext || window.webkitAudioContext)();
var notes = [523.25, 659.25, 783.99, 1046.50];
notes.forEach(function(freq, i) {
var osc = ctx.createOscillator();
var gain = ctx.createGain();
osc.connect(gain);
gain.connect(ctx.destination);
osc.type = "triangle";
osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.1);
gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.1);
gain.gain.linearRampToValueAtTime(0.25, ctx.currentTime + i * 0.1 + 0.05);
gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 0.6);
osc.start(ctx.currentTime + i * 0.1);
osc.stop(ctx.currentTime + i * 0.1 + 0.6);
});
} catch(e) {}
}

osc.type = "sine";
osc.frequency.setValueAtTime(587.33, ctx.currentTime);
osc.frequency.setValueAtTime(880, ctx.currentTime + 0.08);
gain.gain.setValueAtTime(0.15, ctx.currentTime);

}

popup.classList.remove("show");

function updateProgressDisplay(currentTime, totalDuration) {
var fill = document.getElementById("player-progress-fill");
var timeDisplay = document.getElementById("player-time-display");
var dur = totalDuration || currentTrackDuration || 0;
var cur = currentTime || 0;
var pct = dur > 0 ? (cur / dur) * 100 : 0;
fill.style.width = Math.min(100, Math.max(0, pct)) + "%";
timeDisplay.textContent = formatTime(cur) + " / " + formatTime(dur);
}
function startSyntheticTimer(startFromSec, totalDur) {
stopSyntheticTimer();
timerRunning = true;
timerStartTime = Date.now() - (startFromSec * 1000);
timerTotalDuration = totalDur || currentTrackDuration || 0;
function tick() {
if (!timerRunning) return;
var elapsed = (Date.now() - timerStartTime) / 1000;
if (elapsed > timerTotalDuration) { elapsed = timerTotalDuration; timerRunning = false; }
updateProgressDisplay(elapsed, timerTotalDuration);
if (timerRunning) { progressAnimFrame = requestAnimationFrame(tick); }
}
tick();
}
function stopSyntheticTimer() { timerRunning = false; if (progressAnimFrame) cancelAnimationFrame(progressAnimFrame); }

// 🔧 ИСПРАВЛЕНИЕ 1: Обновление визуала джокера с фиксацией состояния

function listenToAudioStream() {
var audioSyncRef = db.ref("rooms/" + currentRoom + "/audioSync");
var aRevers = document.getElementById("player-audio-revers");

audioSyncRef.on("value", function(snapshot) {
var sync = snapshot.val();
if (!sync) return;
if (sync.systemTrigger && sync.systemTrigger.time > lastHandledSystemSoundTime) {
lastHandledSystemSoundTime = sync.systemTrigger.time;
var trigType = sync.systemTrigger.type;
if (trigType === "winner") playLocalSystemSound("player-sound-winner");
if (trigType === "lost") playLocalSystemSound("player-sound-lost");
if (trigType === "ring") playLocalSystemSound("player-sound-ring");
if (trigType === "gameOver") playLocalSystemSound("player-sound-game-over");
if (trigType === "joker") {
showJokerAnimation();
setTimeout(function() { showJokerScoreDelta(); }, 1500);
}
}
if (!hasWaitedForNewTrack) {
if (sync.trackSessionId === joinedTrackSessionId) { return; } else { hasWaitedForNewTrack = true; }
}
// 🔧 ИСПРАВЛЕНИЕ 1: При смене трека сбрасываем фиксированное состояние звёздочки
if (sync.trackSessionId && sync.trackSessionId !== joinedTrackSessionId) {
joinedTrackSessionId = sync.trackSessionId;
currentTrackDuration = 0;
currentTrackShowStar = null; // Сброс фиксированного решения
updateProgressDisplay(0, 0);
hasWaitedForNewTrack = true;
updateJokerVisuals(false);
}
//  ИСПРАВЛЕНИЕ 1: Фиксируем решение по звёздочке ОДИН РАЗ на трек
if (typeof sync.isJoker !== 'undefined' && currentTrackShowStar === null) {
var realJoker = (sync.isJoker === true);
if (realJoker) {
currentTrackShowStar = true; // настоящий джокер — всегда звезда
} else {
currentTrackShowStar = (Math.random() < 0.35); // ложная подсказка 35%
}
updateJokerVisuals(currentTrackShowStar);
}
if (sync.duration && isFinite(sync.duration) && sync.duration > 0) {
currentTrackDuration = sync.duration;
if (!timerRunning && sync.playAction !== "pause") {
updateProgressDisplay(aRevers.currentTime || 0, currentTrackDuration);
}
}
if (sync.reversUrl && sync.reversUrl !== currentLoadedReversUrl) {
currentLoadedReversUrl = sync.reversUrl;
aNormal.pause(); aNormal.currentTime = 0; aNormal.src = ""; aNormal.preload = "none";
aRevers.src = sync.reversUrl; aRevers.preload = "auto"; aRevers.load();
aRevers.onplaying = function() {
aRevers.onplaying = null;
if (sync.normalUrl) { aNormal.src = sync.normalUrl; aNormal.preload = "auto"; aNormal.load(); }
};
aRevers.oncanplay = function() {
aRevers.oncanplay = null;
if (currentRoom && myTeamId) {
db.ref("rooms/" + currentRoom + "/teams/" + myTeamId + "/readyToPlay").set(true);
}
if (sync.normalUrl) {
aNormal.src = sync.normalUrl;
aNormal.preload = "auto";
aNormal.load();
}
};
}
if (sync.playAction === "prepare") {
stopSyntheticTimer(); aRevers.pause(); aRevers.currentTime = 0; aNormal.pause(); aNormal.currentTime = 0;
currentTrackDuration = sync.duration || 0;
updateProgressDisplay(0, currentTrackDuration);
} else if (sync.playAction === "play_revers") {
aNormal.pause(); aNormal.currentTime = 0;
var targetDelay = Math.max(0, (sync.startAt || Date.now()) - Date.now());
var duration = sync.duration || currentTrackDuration || 0;
setTimeout(function() {
if (isStreamAudioAllowed) { aRevers.currentTime = 0; aRevers.play().catch(function() {}); } else { aRevers.pause(); }
startSyntheticTimer(0, duration);
}, targetDelay);
} else if (sync.playAction === "play_silent") {
aNormal.pause(); aRevers.pause();
var targetDelay = Math.max(0, (sync.startAt || Date.now()) - Date.now());
var duration = sync.duration || currentTrackDuration || 0;
setTimeout(function() { startSyntheticTimer(0, duration); }, targetDelay);
} else if (sync.playAction === "resume_revers") {
aNormal.pause(); aNormal.currentTime = 0;
var resumeTime = sync.currentTime || 0;
var resumeDelay = Math.max(0, (sync.startAt || Date.now()) - Date.now());
var rDur = sync.duration || currentTrackDuration || 0;
setTimeout(function() {
if (isStreamAudioAllowed) { aRevers.currentTime = resumeTime; aRevers.play().catch(function() {}); } else { aRevers.pause(); }
startSyntheticTimer(resumeTime, rDur);
}, resumeDelay);
} else if (sync.playAction === "resume_silent") {
aNormal.pause(); aRevers.pause();
var resumeTime = sync.currentTime || 0;
var resumeDelay = Math.max(0, (sync.startAt || Date.now()) - Date.now());
var rDur = sync.duration || currentTrackDuration || 0;
setTimeout(function() { startSyntheticTimer(resumeTime, rDur); }, resumeDelay);
} else if (sync.playAction === "pause") {
aRevers.pause(); aNormal.pause(); stopSyntheticTimer();
var pausedAt = typeof sync.currentTime !== 'undefined' ? sync.currentTime : aRevers.currentTime;
updateProgressDisplay(pausedAt, currentTrackDuration);
} else if (sync.playAction === "play_normal") {
aRevers.pause(); aRevers.currentTime = 0; stopSyntheticTimer();
var normDelay = Math.max(0, (sync.startAt || Date.now()) - Date.now());
setTimeout(function() { if (isStreamAudioAllowed) { aNormal.currentTime = 0; aNormal.play().catch(function(e) { console.warn("Оригинал на телефоне:", e); }); } }, normDelay);
} else if (sync.playAction === "stop") {
aRevers.pause(); aRevers.currentTime = 0; aNormal.pause(); aNormal.currentTime = 0;
stopSyntheticTimer(); updateProgressDisplay(0, currentTrackDuration);
updateJokerVisuals(false);
currentTrackShowStar = null; // Сброс при остановке
}
});
}

function listenToGameState() {
var roomRef = db.ref("rooms/" + currentRoom);
roomRef.on("value", function(snapshot) {
var data = snapshot.val();
if (!data) return;
if (data.status === "game_over") { showGameOverScreen(data.leaderboard || []); return; }
if (data.appVersion && data.appVersion > (parseInt(localStorage.getItem("player_app_version")) || 0)) {
localStorage.setItem("player_app_version", data.appVersion);
if ("caches" in window) {
caches.keys().then(function(keys) { Promise.all(keys.map(function(k) { return caches.delete(k); })).then(function() { location.reload(true); }); });
} else { location.reload(true); }
return;
}
currentRoomStatus = data.status || "idle";
roomChatMode = data.chatMode || "disabled";
isStreamAudioAllowed = (data.streamAudio === true);
if (data.systemSounds && isStreamAudioAllowed) {
bufferSystemSound("player-sound-winner", data.systemSounds.winner);
bufferSystemSound("player-sound-lost", data.systemSounds.lost);
bufferSystemSound("player-sound-ring", data.systemSounds.ring);
bufferSystemSound("player-sound-game-over", data.systemSounds.gameOver);
}
var timerBadge = document.getElementById("player-timer-badge");
var timerNum = document.getElementById("player-timer-badge-num");
var timerState = data.timerState || {};
if (timerState.active && timerState.value > 0) {
timerNum.textContent = timerState.value;
timerBadge.classList.add("show");
if (timerState.value <= 5) { timerBadge.classList.add("urgent"); } else { timerBadge.classList.remove("urgent"); }
} else { timerBadge.classList.remove("show", "urgent"); }
if (data.status === "reveal" || data.status === "playing") { closePlayerChat(); }
if (!isStreamAudioAllowed) {
var aR = document.getElementById("player-audio-revers");
var aN = document.getElementById("player-audio-normal");
if (aR && !aR.paused) aR.pause();
if (aN && !aN.paused) aN.pause();
}
var buzzerBtn = document.getElementById("buzzer-btn");
var passBtn = document.getElementById("pass-btn");
var hudFooter = document.getElementById("hud-footer");
var roundStatusPill = document.getElementById("round-status-pill");
var trackBox = document.getElementById("revealed-track-box");
var trackTitleText = document.getElementById("reveal-song-title-text");
var scoreboardWrap = document.getElementById("scoreboard-wrap");
var showMyScore = data.showScore !== false;
var showOppScore = data.showOpponentScore !== false;
var teams = data.teams || {};
var teamKeys = Object.keys(teams);
if (!showMyScore && !showOppScore) { scoreboardWrap.style.display = "none"; }
else {
scoreboardWrap.style.display = "grid";
scoreboardWrap.innerHTML = "";
if (showMyScore && teams[myTeamId]) {
var myCard = document.createElement("div");
myCard.className = "score-card my-card";
myCard.innerHTML = '<div class="score-team-title">' + (teams[myTeamId].name || myTeamName) + ' (Вы)</div><div class="score-team-pts">' + formatScoreDisplay(teams[myTeamId].score) + '</div>';
scoreboardWrap.appendChild(myCard);
var myTeamData = teams[myTeamId];
if (myTeamData.lastScoreChangeAt && myTeamData.lastScoreChangeAt > lastSeenScoreTimestamp) {
lastSeenScoreTimestamp = myTeamData.lastScoreChangeAt;
if (typeof myTeamData.lastScoreDelta !== 'undefined') {
if (myTeamData.lastScoreDelta >= 3) {
showJokerScoreDelta();
} else {
showScoreDeltaAnimation(myTeamData.lastScoreDelta);
}
}
}
}
if (showOppScore) {
teamKeys.filter(function(k) { return k !== myTeamId; }).forEach(function(k) {
var oppCard = document.createElement("div");
oppCard.className = "score-card opponent-card";
oppCard.innerHTML = '<div class="score-team-title">' + (teams[k].name || "Соперник") + '</div><div class="score-team-pts">' + formatScoreDisplay(teams[k].score) + '</div>';
scoreboardWrap.appendChild(oppCard);
});
}
}
if (!hasWaitedForNewTrack) {
buzzerBtn.disabled = true;
buzzerBtn.className = "buzzer-3d-btn";
buzzerBtn.innerHTML = '<i class="fas fa-hourglass-start"></i><span>ЖДИ</span>';
roundStatusPill.className = "status-pill";
roundStatusPill.innerHTML = '<i class="fas fa-hourglass-start"></i> <span>Ожидание раунда</span>';
trackBox.classList.remove("active-reveal");
hudFooter.innerHTML = "Вы подключились посреди игры. Вход со следующего трека...";
return;
}
var buzzer = data.buzzer || {};
var passedBy = buzzer.passedBy || [];
var haveIPassed = passedBy.indexOf(myTeamId) !== -1;
canBuzzerAnswerNow = (buzzer.pressedBy === myTeamId);
updateChatTriggerButtonState();
if (data.status === "playing") {
trackBox.classList.remove("active-reveal");
roundStatusPill.className = "status-pill playing";
roundStatusPill.innerHTML = '<i class="fas fa-volume-up"></i> <span>Трек играет!</span>';
if (!buzzer.locked) {
passBtn.style.display = "none";
if (haveIPassed) {
buzzerBtn.disabled = true; buzzerBtn.className = "buzzer-3d-btn";
buzzerBtn.innerHTML = '<i class="fas fa-forward"></i><span>ПАС</span>';
hudFooter.innerHTML = "Вы спасовали. Ожидаем ответы соперников...";
} else {
buzzerBtn.disabled = false; buzzerBtn.className = "buzzer-3d-btn";
buzzerBtn.innerHTML = '<i class="fas fa-bolt"></i><span>ЖМИ!</span>';
hudFooter.innerHTML = "Слушай внимательно и нажимай быстрее!";
}
} else {
if (buzzer.pressedBy === myTeamId) {
buzzerBtn.disabled = true; buzzerBtn.className = "buzzer-3d-btn winner-turn";
buzzerBtn.innerHTML = '<i class="fas fa-microphone"></i><span>ОТВЕТ!</span>';
passBtn.style.display = "inline-flex";
if (roomChatMode !== "disabled") {
hudFooter.innerHTML = "🏆 <strong style='color:var(--neon-cyan)'>Вы успели первым! Напишите ответ в чат:</strong>";
if (!isChatOpen) { openPlayerChat(); }
} else { hudFooter.innerHTML = " <strong style='color:var(--neon-cyan)'>Вы успели первым! Называйте трек ведущему!</strong>"; }
} else {
passBtn.style.display = "none";
buzzerBtn.disabled = true; buzzerBtn.className = "buzzer-3d-btn";
buzzerBtn.innerHTML = '<i class="fas fa-lock"></i><span>БЛОК</span>';
var fastTeam = buzzer.pressedByName || "Соперник";
hudFooter.innerHTML = "⛔ <strong>" + fastTeam + "</strong> отвечает!";
}
}
} else if (data.status === "reveal") {
passBtn.style.display = "none";
buzzerBtn.disabled = true; buzzerBtn.className = "buzzer-3d-btn";
buzzerBtn.innerHTML = '<i class="fas fa-music"></i><span>ОТВЕТ</span>';
roundStatusPill.className = "status-pill";
roundStatusPill.innerHTML = '<i class="fas fa-check-circle"></i> <span>Раунд завершён</span>';
hudFooter.innerHTML = "Звучит оригинальная версия трека.";
if (data.revealedTrack) { trackTitleText.textContent = data.revealedTrack; trackBox.classList.add("active-reveal"); }
} else {
passBtn.style.display = "none";
buzzerBtn.disabled = true; buzzerBtn.className = "buzzer-3d-btn";
buzzerBtn.innerHTML = '<i class="fas fa-hourglass-start"></i><span>ЖДИ</span>';
roundStatusPill.className = "status-pill";
roundStatusPill.innerHTML = '<i class="fas fa-hourglass-start"></i> <span>Подготовка</span>';
trackBox.classList.remove("active-reveal");
hudFooter.innerHTML = "Ведущий выбирает следующий трек...";
}
});
}
function updateChatTriggerButtonState() {
var triggerBtn = document.getElementById("player-chat-toggle-btn");
if (!triggerBtn) return;
if (roomChatMode === "disabled") { triggerBtn.style.display = "none"; closePlayerChat(); return; }
triggerBtn.style.display = "flex";
var isRestrictedNow = (roomChatMode === "restricted" && currentRoomStatus === "playing" && !canBuzzerAnswerNow);
if (isRestrictedNow) { triggerBtn.classList.add("disabled"); } else { triggerBtn.classList.remove("disabled"); }
}
function openPlayerChat() {
if (roomChatMode === "disabled") return;
var modal = document.getElementById("player-chat-modal");
var triggerBtn = document.getElementById("player-chat-toggle-btn");
isChatOpen = true;
modal.style.display = "flex";
unreadChatCount = 0; updatePlayerChatBadge(); triggerBtn.classList.remove("has-pulse");
var box = document.getElementById("player-chat-messages");
box.scrollTop = box.scrollHeight;
setTimeout(function() { document.getElementById("player-chat-input").focus(); }, 150);
}
function closePlayerChat() {
var modal = document.getElementById("player-chat-modal");
isChatOpen = false;
modal.style.display = "none";
document.getElementById("player-emoji-popover").style.display = "none";
}
function togglePlayerChat() {
if (roomChatMode === "disabled") return;
if (roomChatMode === "restricted" && currentRoomStatus === "playing" && !canBuzzerAnswerNow) { return; }
if (isChatOpen) { closePlayerChat(); } else { openPlayerChat(); }
}
function updatePlayerChatBadge() {
var badge = document.getElementById("player-chat-unread");
if (!badge) return;
if (unreadChatCount > 0 && roomChatMode !== "disabled") { badge.textContent = unreadChatCount; badge.style.display = "inline-block"; }
else { badge.style.display = "none"; }
}
function listenToPlayerChat() {
if (!currentRoom) return;
var chatRef = db.ref("rooms/" + currentRoom + "/chat");
var msgBox = document.getElementById("player-chat-messages");
var triggerBtn = document.getElementById("player-chat-toggle-btn");
chatRef.limitToLast(50).on("child_added", function(snapshot) {
var msg = snapshot.val();
if (!msg) return;
var row = document.createElement("div");
var isMine = msg.teamId === myTeamId;
row.className = "chat-msg" + (isMine ? " mine" : "") + (msg.isHost ? " host" : "") + (msg.isSystem ? " system" : "");
if (msg.isSystem) {
if (msg.text && msg.text.indexOf("джокер") !== -1) {
row.classList.add("joker");
}
row.innerHTML = '<div>🔔 ' + msg.text + '</div>';
}
else { row.innerHTML = '<div class="name">' + msg.author + '</div><div class="text">' + msg.text + '</div>'; }
msgBox.appendChild(row); msgBox.scrollTop = msgBox.scrollHeight;
if (!isChatOpen && !isMine && roomChatMode !== "disabled") {
unreadChatCount++; updatePlayerChatBadge(); triggerBtn.classList.add("has-pulse");
if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
playMessageNotificationSound();
}
});
}
function sendPlayerChatMessage() {
if (roomChatMode === "disabled") return;
var input = document.getElementById("player-chat-input");
var text = input.value.trim();
if (!text || !currentRoom) return;
db.ref("rooms/" + currentRoom + "/chat").push({ author: myTeamName, teamId: myTeamId, text: text, isHost: false, time: Date.now() });
input.value = ""; document.getElementById("player-emoji-popover").style.display = "none";
}
function showGameOverScreen(leaderboard) {
if (gameOverTimer) return;
var aRevers = document.getElementById("player-audio-revers");
var aNormal = document.getElementById("player-audio-normal");
if (aRevers) { aRevers.pause(); aRevers.currentTime = 0; aRevers.removeAttribute("src"); aRevers.load(); }
if (aNormal) { aNormal.pause(); aNormal.currentTime = 0; aNormal.removeAttribute("src"); aNormal.load(); }
stopSyntheticTimer();
closePlayerChat();
localStorage.removeItem("rq_saved_pin");
localStorage.removeItem("rq_saved_team_id");
localStorage.removeItem("rq_saved_team_name");
document.getElementById("game-view").style.display = "none";
var overView = document.getElementById("game-over-view");
overView.style.display = "flex";
var winnerBadge = document.getElementById("winner-badge-text");
var list = document.getElementById("final-leaderboard-list");
list.innerHTML = "";
if (leaderboard.length > 0) {
var topScore = leaderboard[0].score;
var winners = leaderboard.filter(function(t) { return t.score === topScore; });
var isDraw = winners.length > 1;
if (isDraw) {
winnerBadge.textContent = "🤝 Боевая ничья!";
} else {
winnerBadge.textContent = " " + winners[0].name + " побеждает!";
}
leaderboard.forEach(function(t, idx) {
var row = document.createElement("div");
var isWinner = (t.score === topScore);
row.className = "leaderboard-row" + (isWinner ? " gold" : "");
var prefix = isWinner ? '🥇 ' : (idx + 1) + '. ';
row.innerHTML = '<span>' + prefix + t.name + '</span><span class="pts">' + formatScoreDisplay(t.score) + '</span>';
list.appendChild(row);
});
}
var timeLeft = 10;
var secSpan = document.getElementById("reset-seconds");
secSpan.textContent = timeLeft;
gameOverTimer = setInterval(function() {
timeLeft--;
if (secSpan) secSpan.textContent = timeLeft;
if (timeLeft <= 0) { clearInterval(gameOverTimer); gameOverTimer = null; window.location.reload(); }
}, 1000);
}
function pressBuzzer() {
if (!currentRoom || !myTeamId) return;
if (navigator.vibrate) navigator.vibrate([40]);
var buzzerRef = db.ref("rooms/" + currentRoom + "/buzzer");
buzzerRef.transaction(function(buzzer) {
if (!buzzer) buzzer = {};
if (buzzer.locked) return;
var passed = buzzer.passedBy || [];
if (passed.indexOf(myTeamId) !== -1) return;
return { locked: true, pressedBy: myTeamId, pressedByName: myTeamName, passedBy: passed, time: Date.now() };
}, function(error, committed) {
if (committed && roomChatMode !== "disabled") {
db.ref("rooms/" + currentRoom + "/chat").push({ author: "Система", text: "⚡ " + myTeamName + " жмёт кнопку и отвечает!", isSystem: true, time: Date.now() });
}
});
}
function passTurn() {
if (!currentRoom || !myTeamId) return;
if (navigator.vibrate) navigator.vibrate([20, 30, 20]);
var buzzerRef = db.ref("rooms/" + currentRoom + "/buzzer");
buzzerRef.transaction(function(buzzer) {
if (!buzzer || buzzer.pressedBy !== myTeamId) return;
var passed = buzzer.passedBy || [];
if (passed.indexOf(myTeamId) === -1) { passed.push(myTeamId); }
return { locked: false, pressedBy: null, pressedByName: null, passedBy: passed, time: Date.now() };
}, function(error, committed) {
if (committed && roomChatMode !== "disabled") {
db.ref("rooms/" + currentRoom + "/chat").push({ author: "Система", text: "⏩ " + myTeamName + " пасует ход!", isSystem: true, time: Date.now() });
}
});
}
</script>
</body>
</html>
