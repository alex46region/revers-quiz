<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#030407" />
<meta name="referrer" content="no-referrer" />
<title>⚡ Revers Quiz — Экран команды</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Syne:wght@800&family=Ubuntu+Mono:wght@700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<!-- Firebase App & Database -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
:root {
  --bg-deep: #030407;
  --bg-card: rgba(14, 18, 26, 0.75);
  --neon-cyan: #00f0ff;
  --neon-pink: #ff0055;
  --neon-yellow: #ffe600;
  --neon-lime: #00ff66;
  --neon-purple: #7000ff;
  --text-pure: #ffffff;
  --text-dim: #7d8ea6;
  --border-glow: rgba(0, 240, 255, 0.2);
  --border-subtle: rgba(255, 255, 255, 0.08);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Space Grotesk', sans-serif;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

body {
  background-color: var(--bg-deep);
  background-image: 
    radial-gradient(circle at 50% 10%, rgba(0, 240, 255, 0.12) 0%, transparent 50%),
    radial-gradient(circle at 10% 90%, rgba(112, 0, 255, 0.12) 0%, transparent 50%),
    radial-gradient(circle at 90% 90%, rgba(255, 0, 85, 0.12) 0%, transparent 50%);
  color: var(--text-pure);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: 14px;
  overflow: hidden;
}

.login-wrap {
  margin: auto;
  width: 100%;
  max-width: 380px;
  background: var(--bg-card);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border-glow);
  border-radius: 28px;
  padding: 32px 24px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 240, 255, 0.1);
  animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

.brand-icon {
  width: 58px;
  height: 58px;
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 14px;
  font-size: 1.6em;
  color: #000;
  box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
}

.login-wrap h2 {
  font-family: 'Syne', sans-serif;
  font-size: 1.7em;
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}

.login-wrap p {
  color: var(--text-dim);
  font-size: 0.85em;
  margin-bottom: 22px;
  line-height: 1.4;
}

.input-box {
  margin-bottom: 12px;
}

.input-box input {
  width: 100%;
  padding: 15px 16px;
  background: rgba(5, 6, 10, 0.8);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  color: #fff;
  font-size: 17px;
  font-weight: 700;
  text-align: center;
  outline: none;
  transition: all 0.2s;
}

.input-box input:focus {
  border-color: var(--neon-cyan);
  box-shadow: 0 0 20px rgba(0, 240, 255, 0.25);
}

.btn-join {
  width: 100%;
  padding: 16px;
  margin-top: 6px;
  background: linear-gradient(90deg, var(--neon-cyan), #00aaff);
  color: #000;
  border: none;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  cursor: pointer;
  box-shadow: 0 6px 25px rgba(0, 240, 255, 0.35);
}

.btn-join:active {
  transform: scale(0.98);
}

.error-banner {
  color: var(--neon-pink);
  background: rgba(255, 0, 85, 0.1);
  border: 1px solid rgba(255, 0, 85, 0.3);
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 0.85em;
  font-weight: 700;
  margin-top: 14px;
  display: none;
}

#game-view {
  display: none;
  flex-direction: column;
  flex: 1;
  max-width: 480px;
  width: 100%;
  margin: 0 auto;
  justify-content: space-between;
}

/* Компактное табло очков */
.scoreboard-arena {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(75px, 1fr));
  gap: 6px;
  width: 100%;
  margin-bottom: 10px;
}

.score-card {
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 6px 4px;
  text-align: center;
  transition: all 0.2s;
  min-width: 0;
}

.score-card.my-card {
  border-color: var(--neon-cyan);
  background: rgba(0, 240, 255, 0.08);
  box-shadow: 0 0 14px rgba(0, 240, 255, 0.2);
}

.score-card.opponent-card {
  border-color: rgba(255, 0, 85, 0.25);
  background: rgba(255, 0, 85, 0.03);
}

.score-team-title {
  font-size: 0.68em;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding: 0 2px;
}

.my-card .score-team-title {
  color: var(--neon-cyan);
}

.score-team-pts {
  font-family: 'Ubuntu Mono', monospace;
  font-size: 1.45em;
  font-weight: 700;
  line-height: 1.1;
  margin-top: 2px;
}

.my-card .score-team-pts {
  color: var(--neon-cyan);
  text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
}

.opponent-card .score-team-pts {
  color: var(--neon-pink);
}

.player-status-wrapper {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.status-pill {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  padding: 8px 14px;
  text-align: center;
  font-size: 0.85em;
  font-weight: 700;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.status-pill.playing {
  border-color: var(--neon-yellow);
  color: var(--neon-yellow);
  box-shadow: 0 0 15px rgba(255, 230, 0, 0.15);
}

/* Блок таймера трека (всегда виден во время раунда) */
.track-timer-bar {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.progress-track {
  flex: 1;
  height: 6px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 4px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--neon-cyan);
  box-shadow: 0 0 8px var(--neon-cyan);
  width: 0%;
  transition: width 0.1s linear;
}

.track-time-text {
  font-family: 'Ubuntu Mono', monospace;
  font-size: 0.85em;
  color: var(--neon-yellow);
  min-width: 80px;
  text-align: right;
  font-weight: 700;
}

.revealed-track-box {
  background: rgba(0, 255, 102, 0.1);
  border: 1px solid var(--neon-lime);
  color: var(--neon-lime);
  border-radius: 12px;
  padding: 10px 14px;
  text-align: center;
  font-size: 0.95em;
  font-weight: 700;
  margin-top: 4px;
  display: none;
}

.buzzer-stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  gap: 16px;
  padding: 8px 0;
}

.buzzer-halo {
  position: relative;
  border-radius: 50%;
  padding: 12px;
  background: radial-gradient(circle, rgba(255, 0, 85, 0.15) 0%, transparent 70%);
}

.buzzer-3d-btn {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  border: 4px solid rgba(255, 255, 255, 0.15);
  background: radial-gradient(circle at 35% 35%, #ff2a70, #c40042 60%, #700024 100%);
  color: #fff;
  font-family: 'Syne', sans-serif;
  font-size: 1.7em;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 2px;
  cursor: pointer;
  box-shadow: 
    0 15px 35px rgba(255, 0, 85, 0.4),
    0 0 50px rgba(255, 0, 85, 0.25),
    inset 0 4px 8px rgba(255, 255, 255, 0.4),
    inset 0 -8px 16px rgba(0, 0, 0, 0.6);
  transition: all 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.buzzer-3d-btn:active:not(:disabled) {
  transform: scale(0.92) translateY(6px);
  box-shadow: 0 5px 15px rgba(255, 0, 85, 0.5);
}

.buzzer-3d-btn:disabled {
  background: radial-gradient(circle, #252a36 0%, #151821 100%);
  border-color: rgba(255, 255, 255, 0.05);
  color: #4a5468;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none;
}

.buzzer-3d-btn.winner-turn {
  background: radial-gradient(circle at 35% 35%, #2eff84, #00bd4c 60%, #006b2b 100%);
  box-shadow: 0 0 70px rgba(0, 255, 102, 0.7), inset 0 4px 10px rgba(255, 255, 255, 0.6);
  color: #000;
  animation: pulseTurn 0.8s infinite alternate;
}

@keyframes pulseTurn {
  0% { transform: scale(0.97); }
  100% { transform: scale(1.03); }
}

.pass-turn-btn {
  background: rgba(255, 230, 0, 0.08);
  border: 1px solid var(--neon-yellow);
  color: var(--neon-yellow);
  padding: 10px 22px;
  border-radius: 12px;
  font-weight: 800;
  font-size: 0.85em;
  text-transform: uppercase;
  letter-spacing: 1px;
  cursor: pointer;
  display: none;
  animation: fadeIn 0.3s;
}

.pass-turn-btn:active {
  background: var(--neon-yellow);
  color: #000;
}

.hud-footer {
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  padding: 12px;
  text-align: center;
  font-size: 0.9em;
  color: var(--text-dim);
}

.hud-footer strong {
  color: #fff;
}

#game-over-view {
  display: none;
  flex-direction: column;
  margin: auto;
  width: 100%;
  max-width: 400px;
  background: var(--bg-card);
  backdrop-filter: blur(20px);
  border: 1px solid var(--neon-yellow);
  box-shadow: 0 0 50px rgba(255, 230, 0, 0.2);
  border-radius: 28px;
  padding: 28px 20px;
  text-align: center;
  animation: fadeIn 0.4s ease;
}

.trophy-icon {
  font-size: 3em;
  color: var(--neon-yellow);
  filter: drop-shadow(0 0 18px var(--neon-yellow));
  margin-bottom: 10px;
}

.game-over-title {
  font-family: 'Syne', sans-serif;
  font-size: 1.8em;
  margin-bottom: 4px;
}

.winner-name-badge {
  font-size: 1.3em;
  font-weight: 800;
  color: var(--neon-lime);
  margin-bottom: 16px;
  text-shadow: 0 0 15px rgba(0, 255, 102, 0.5);
}

.final-leaderboard {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 20px;
  text-align: left;
}

.leaderboard-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(5, 6, 10, 0.8);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 0.95em;
  font-weight: 700;
}

.leaderboard-row.gold {
  border-color: var(--neon-yellow);
  background: rgba(255, 230, 0, 0.08);
}

.leaderboard-row .pts {
  font-family: 'Ubuntu Mono', monospace;
  font-size: 1.2em;
  color: var(--neon-cyan);
}

.countdown-box {
  font-size: 0.85em;
  color: var(--text-dim);
}

.countdown-box span {
  font-family: 'Ubuntu Mono', monospace;
  font-weight: 700;
  color: var(--neon-pink);
  font-size: 1.2em;
}
</style>
</head>
<body>

<audio id="player-audio-revers" preload="auto" playsinline crossorigin="anonymous" style="display:none;"></audio>
<audio id="player-audio-normal" preload="auto" playsinline crossorigin="anonymous" style="display:none;"></audio>

<!-- 1. Экран логина -->
<div class="login-wrap" id="login-view">
  <div class="brand-icon"><i class="fas fa-bolt"></i></div>
  <h2>Вход в игру</h2>
  <p>Введите PIN-код с экрана ведущего и назовите команду</p>
  
  <div class="input-box">
    <input type="number" id="room-pin" placeholder="PIN код" pattern="[0-9]*" />
  </div>
  <div class="input-box">
    <input type="text" id="team-name" placeholder="Название команды" maxlength="20" />
  </div>

  <button class="btn-join" onclick="joinGame()">Подключиться</button>
  <div class="error-banner" id="login-error"></div>
</div>

<!-- 2. Игровой экран участника -->
<div id="game-view">
  <div class="scoreboard-arena" id="scoreboard-wrap"></div>

  <div class="player-status-wrapper">
    <div class="status-pill" id="round-status-pill">
      <i class="fas fa-hourglass-half"></i> <span>Ожидание раунда</span>
    </div>

    <!-- Таймер и шкала прогресса -->
    <div class="track-timer-bar" id="player-timer-bar">
      <i class="fas fa-music" style="color:var(--neon-cyan); font-size:0.9em;"></i>
      <div class="progress-track">
        <div class="progress-fill" id="player-progress-fill"></div>
      </div>
      <div class="track-time-text" id="player-time-display">00:00 / 00:00</div>
    </div>

    <div class="revealed-track-box" id="revealed-track-box"></div>
  </div>

  <div class="buzzer-stage">
    <div class="buzzer-halo">
      <button class="buzzer-3d-btn" id="buzzer-btn" disabled onclick="pressBuzzer()">
        <i class="fas fa-hand-paper" style="font-size:1.1em; margin-bottom:2px;"></i>
        <span>ЖДИ</span>
      </button>
    </div>
    <button class="pass-turn-btn" id="pass-btn" onclick="passTurn()">
      <i class="fas fa-forward"></i> Пас / Пропустить ход
    </button>
  </div>

  <div class="hud-footer" id="hud-footer">
    Ожидаем запуск раунда ведущим...
  </div>
</div>

<!-- 3. Экран завершения игры -->
<div id="game-over-view">
  <div class="trophy-icon"><i class="fas fa-trophy"></i></div>
  <div class="game-over-title">Итоги игры</div>
  <div class="winner-name-badge" id="winner-badge-text">Победитель!</div>
  
  <div class="final-leaderboard" id="final-leaderboard-list"></div>
  
  <div class="countdown-box">
    Возврат к вводу PIN через: <span id="reset-seconds">10</span> сек.
  </div>
</div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyC9sh7uazv-WbudsO7TYap4-wENjkLD3K4",
  authDomain: "revers-quiz.firebaseapp.com",
  databaseURL: "https://revers-quiz-default-rtdb.firebaseio.com",
  projectId: "revers-quiz",
  storageBucket: "revers-quiz.firebasestorage.app",
  messagingSenderId: "940882425335",
  appId: "1:940882425335:web:bf3c52135d8a7cd7d9eaf2",
  measurementId: "G-93CJT9ZT4G"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();

var currentRoom = null;
var myTeamId = null;
var myTeamName = "";
var gameOverTimer = null;
var currentLoadedReversUrl = "";
var currentTrackDuration = 0;
var progressAnimFrame = null;

// Защита от автозапуска старого трека при позднем подключении
var joinedTrackSessionId = null;
var hasWaitedForNewTrack = false;

function formatTime(seconds) {
  seconds = Math.floor(seconds || 0);
  var mins = Math.floor(seconds / 60);
  var secs = seconds % 60;
  return String(mins).padStart(2, '0') + ":" + String(secs).padStart(2, '0');
}

function unlockBrowserAudio() {
  ['player-audio-revers', 'player-audio-normal'].forEach(function(id) {
    var a = document.getElementById(id);
    if (a) {
      a.play().then(function() {
        a.pause();
        a.currentTime = 0;
      }).catch(function() {});
    }
  });
}
document.addEventListener('click', unlockBrowserAudio);
document.addEventListener('touchstart', unlockBrowserAudio);

function showError(msg) {
  var err = document.getElementById("login-error");
  err.textContent = msg;
  err.style.display = "block";
}

function joinGame() {
  unlockBrowserAudio();

  var pin = document.getElementById("room-pin").value.trim();
  var name = document.getElementById("team-name").value.trim();

  if (!pin) {
    showError("Введите PIN-код комнаты!");
    return;
  }
  if (!name) {
    showError("Укажите название вашей команды!");
    return;
  }

  showError("Подключение к комнате...");
  var roomRef = db.ref("rooms/" + pin);

  roomRef.once("value").then(function(snapshot) {
    if (!snapshot.exists()) {
      showError("❌ Комната с PIN " + pin + " не найдена. Проверьте код у ведущего!");
      return;
    }

    var currentData = snapshot.val();
    // Фиксируем ID трека, который УЖЕ играет или играл в комнате при нашем входе
    if (currentData && currentData.audioSync && currentData.audioSync.trackSessionId) {
      joinedTrackSessionId = currentData.audioSync.trackSessionId;
      hasWaitedForNewTrack = false; // Ждем следующий трек
    } else {
      hasWaitedForNewTrack = true;
    }

    currentRoom = pin;
    myTeamName = name;
    myTeamId = "team_" + Math.random().toString(36).substr(2, 6);

    roomRef.child("teams/" + myTeamId).set({
      name: myTeamName,
      ready: true,
      readyToPlay: false,
      score: 0
    });

    roomRef.child("teams/" + myTeamId).onDisconnect().remove();

    document.getElementById("login-view").style.display = "none";
    document.getElementById("game-view").style.display = "flex";

    listenToGameState();
    listenToAudioStream();
  }).catch(function(e) {
    showError("Ошибка подключения: " + e.message);
  });
}

function updateProgressDisplay(currentTime, totalDuration) {
  var fill = document.getElementById("player-progress-fill");
  var timeDisplay = document.getElementById("player-time-display");

  var dur = totalDuration || currentTrackDuration || 0;
  var cur = currentTime || 0;

  var pct = dur > 0 ? (cur / dur) * 100 : 0;
  fill.style.width = Math.min(100, Math.max(0, pct)) + "%";
  timeDisplay.textContent = formatTime(cur) + " / " + formatTime(dur);
}

function runSyntheticTimer(startAt, duration) {
  if (progressAnimFrame) cancelAnimationFrame(progressAnimFrame);

  function tick() {
    var elapsed = Math.max(0, (Date.now() - startAt) / 1000);
    updateProgressDisplay(elapsed, duration);
    if (elapsed < duration) {
      progressAnimFrame = requestAnimationFrame(tick);
    }
  }
  tick();
}

function listenToAudioStream() {
  var audioSyncRef = db.ref("rooms/" + currentRoom + "/audioSync");
  var aRevers = document.getElementById("player-audio-revers");
  var aNormal = document.getElementById("player-audio-normal");

  audioSyncRef.on("value", function(snapshot) {
    var sync = snapshot.val();
    if (!sync) return;

    // Проверяем: если этот трек уже играл до нашего подключения, игнорируем его
    if (!hasWaitedForNewTrack) {
      if (sync.trackSessionId === joinedTrackSessionId) {
        return; // Пропускаем старый трек
      } else {
        hasWaitedForNewTrack = true; // Начался новый трек, теперь мы в игре!
      }
    }

    if (sync.duration) {
      currentTrackDuration = sync.duration;
      updateProgressDisplay(0, currentTrackDuration);
    }

    // Фоновая предзагрузка нового трека
    if (sync.reversUrl && sync.reversUrl !== currentLoadedReversUrl) {
      currentLoadedReversUrl = sync.reversUrl;

      aRevers.src = sync.reversUrl;
      aRevers.load();

      if (sync.normalUrl) {
        aNormal.src = sync.normalUrl;
        aNormal.load();
      }

      aRevers.oncanplay = function() {
        if (currentRoom && myTeamId) {
          db.ref("rooms/" + currentRoom + "/teams/" + myTeamId + "/readyToPlay").set(true);
        }
        aRevers.oncanplay = null;
      };
    }

    // Воспроизведение по точной метке времени startAt
    if (sync.playAction === "play_revers") {
      aNormal.pause();
      
      var targetDelay = Math.max(0, (sync.startAt || Date.now()) - Date.now());
      var duration = sync.duration || currentTrackDuration || 0;

      setTimeout(function() {
        aRevers.currentTime = 0;
        var p = aRevers.play();
        if (p !== undefined) {
          p.catch(function(e) {
            console.warn("Аудио заблокировано браузером (работает визуальный таймер):", e);
          });
        }
        // Запускаем таймер времени и прогресс-бар в любом режиме
        runSyntheticTimer(Date.now(), duration);
      }, targetDelay);

    } else if (sync.playAction === "play_normal") {
      aRevers.pause();
      if (progressAnimFrame) cancelAnimationFrame(progressAnimFrame);

      var normDelay = Math.max(0, (sync.startAt || Date.now()) - Date.now());
      setTimeout(function() {
        aNormal.currentTime = 0;
        aNormal.play().catch(function() {});
      }, normDelay);

    } else if (sync.playAction === "pause") {
      aRevers.pause();
      aNormal.pause();
      if (progressAnimFrame) cancelAnimationFrame(progressAnimFrame);
    } else if (sync.playAction === "stop") {
      aRevers.pause();
      aNormal.pause();
      aRevers.currentTime = 0;
      aNormal.currentTime = 0;
      if (progressAnimFrame) cancelAnimationFrame(progressAnimFrame);
      updateProgressDisplay(0, currentTrackDuration);
    }
  });
}

function listenToGameState() {
  var roomRef = db.ref("rooms/" + currentRoom);

  roomRef.on("value", function(snapshot) {
    var data = snapshot.val();
    if (!data) return;

    if (data.status === "game_over") {
      showGameOverScreen(data.leaderboard || []);
      return;
    }

    var buzzerBtn = document.getElementById("buzzer-btn");
    var passBtn = document.getElementById("pass-btn");
    var hudFooter = document.getElementById("hud-footer");
    var roundStatusPill = document.getElementById("round-status-pill");
    var trackBox = document.getElementById("revealed-track-box");
    var scoreboardWrap = document.getElementById("scoreboard-wrap");

    var showMyScore = data.showScore !== false;
    var showOppScore = data.showOpponentScore !== false;

    var teams = data.teams || {};
    var teamKeys = Object.keys(teams);

    if (!showMyScore && !showOppScore) {
      scoreboardWrap.style.display = "none";
    } else {
      scoreboardWrap.style.display = "grid";
      scoreboardWrap.innerHTML = "";

      if (showMyScore && teams[myTeamId]) {
        var myCard = document.createElement("div");
        myCard.className = "score-card my-card";
        myCard.innerHTML = 
          '<div class="score-team-title">' + (teams[myTeamId].name || myTeamName) + ' (Вы)</div>' +
          '<div class="score-team-pts">' + (teams[myTeamId].score || 0) + '</div>';
        scoreboardWrap.appendChild(myCard);
      }

      if (showOppScore) {
        teamKeys.filter(function(k) { return k !== myTeamId; }).forEach(function(k) {
          var oppCard = document.createElement("div");
          oppCard.className = "score-card opponent-card";
          oppCard.innerHTML = 
            '<div class="score-team-title">' + (teams[k].name || "Соперник") + '</div>' +
            '<div class="score-team-pts">' + (teams[k].score || 0) + '</div>';
          scoreboardWrap.appendChild(oppCard);
        });
      }
    }

    // Если команда подключилась посреди раунда — ждём следующий
    if (!hasWaitedForNewTrack) {
      buzzerBtn.disabled = true;
      buzzerBtn.className = "buzzer-3d-btn";
      buzzerBtn.innerHTML = '<i class="fas fa-hourglass-start"></i><span>ЖДИ</span>';
      roundStatusPill.className = "status-pill";
      roundStatusPill.innerHTML = '<i class="fas fa-hourglass-start"></i> <span>Ожидание раунда</span>';
      trackBox.style.display = "none";
      hudFooter.innerHTML = "Вы подключились посреди игры. Вход со следующего трека...";
      return;
    }

    var buzzer = data.buzzer || {};
    var passedBy = buzzer.passedBy || [];
    var haveIPassed = passedBy.indexOf(myTeamId) !== -1;

    if (data.status === "playing") {
      trackBox.style.display = "none";
      roundStatusPill.className = "status-pill playing";
      roundStatusPill.innerHTML = '<i class="fas fa-volume-up"></i> <span>Трек играет!</span>';
      
      if (!buzzer.locked) {
        passBtn.style.display = "none";
        
        if (haveIPassed) {
          buzzerBtn.disabled = true;
          buzzerBtn.className = "buzzer-3d-btn";
          buzzerBtn.innerHTML = '<i class="fas fa-forward"></i><span>ПАС</span>';
          hudFooter.innerHTML = "Вы спасовали. Ожидаем соперников...";
        } else {
          buzzerBtn.disabled = false;
          buzzerBtn.className = "buzzer-3d-btn";
          buzzerBtn.innerHTML = '<i class="fas fa-bolt"></i><span>ЖМИ!</span>';
          hudFooter.innerHTML = "Слушай внимательно и нажимай быстрее!";
        }
      } else {
        if (buzzer.pressedBy === myTeamId) {
          buzzerBtn.disabled = true;
          buzzerBtn.className = "buzzer-3d-btn winner-turn";
          buzzerBtn.innerHTML = '<i class="fas fa-microphone"></i><span>ОТВЕТ!</span>';
          passBtn.style.display = "inline-flex";
          hudFooter.innerHTML = "🏆 <strong style='color:var(--neon-lime)'>Вы успели первым! Называйте трек или пасуйте:</strong>";
        } else {
          passBtn.style.display = "none";
          buzzerBtn.disabled = true;
          buzzerBtn.className = "buzzer-3d-btn";
          buzzerBtn.innerHTML = '<i class="fas fa-lock"></i><span>БЛОК</span>';
          var fastTeam = buzzer.pressedByName || "Соперник";
          hudFooter.innerHTML = "⛔ <strong>" + fastTeam + "</strong> отвечает первым!";
        }
      }
    } else if (data.status === "reveal") {
      passBtn.style.display = "none";
      buzzerBtn.disabled = true;
      buzzerBtn.className = "buzzer-3d-btn";
      buzzerBtn.innerHTML = '<i class="fas fa-music"></i><span>ОТВЕТ</span>';
      roundStatusPill.className = "status-pill";
      roundStatusPill.innerHTML = '<i class="fas fa-check-circle"></i> <span>Раунд завершён</span>';
      hudFooter.innerHTML = "Звучит оригинальная версия трека.";
      
      if (data.revealedTrack) {
        trackBox.style.display = "block";
        trackBox.innerHTML = '<i class="fas fa-play-circle"></i> ' + data.revealedTrack;
      }
    } else {
      passBtn.style.display = "none";
      buzzerBtn.disabled = true;
      buzzerBtn.className = "buzzer-3d-btn";
      buzzerBtn.innerHTML = '<i class="fas fa-hourglass-start"></i><span>ЖДИ</span>';
      roundStatusPill.className = "status-pill";
      roundStatusPill.innerHTML = '<i class="fas fa-hourglass-start"></i> <span>Подготовка</span>';
      trackBox.style.display = "none";
      hudFooter.innerHTML = "Ведущий выбирает следующий трек...";
    }
  });
}

function showGameOverScreen(leaderboard) {
  if (gameOverTimer) return;

  var aRevers = document.getElementById("player-audio-revers");
  var aNormal = document.getElementById("player-audio-normal");
  if (aRevers) aRevers.pause();
  if (aNormal) aNormal.pause();
  if (progressAnimFrame) cancelAnimationFrame(progressAnimFrame);

  document.getElementById("game-view").style.display = "none";
  var overView = document.getElementById("game-over-view");
  overView.style.display = "flex";

  var winnerBadge = document.getElementById("winner-badge-text");
  var list = document.getElementById("final-leaderboard-list");
  list.innerHTML = "";

  if (leaderboard.length > 0) {
    var topScore = leaderboard[0].score;
    var winners = leaderboard.filter(function(t) { return t.score === topScore; });

    if (winners.length > 1) {
      winnerBadge.textContent = "🤝 Боевая ничья!";
    } else {
      winnerBadge.textContent = "🏆 " + winners[0].name + " побеждает!";
    }

    leaderboard.forEach(function(t, idx) {
      var row = document.createElement("div");
      row.className = "leaderboard-row" + (idx === 0 ? " gold" : "");
      row.innerHTML = 
        '<span>' + (idx === 0 ? '🥇 ' : (idx + 1) + '. ') + t.name + '</span>' +
        '<span class="pts">' + t.score + '</span>';
      list.appendChild(row);
    });
  }

  var timeLeft = 10;
  var secSpan = document.getElementById("reset-seconds");
  secSpan.textContent = timeLeft;

  gameOverTimer = setInterval(function() {
    timeLeft--;
    if (secSpan) secSpan.textContent = timeLeft;

    if (timeLeft <= 0) {
      clearInterval(gameOverTimer);
      gameOverTimer = null;
      window.location.reload();
    }
  }, 1000);
}

function pressBuzzer() {
  if (!currentRoom || !myTeamId) return;

  if (navigator.vibrate) navigator.vibrate([40]);

  var buzzerRef = db.ref("rooms/" + currentRoom + "/buzzer");
  
  buzzerRef.transaction(function(buzzer) {
    if (!buzzer) buzzer = {};
    if (buzzer.locked) return;
    
    var passed = buzzer.passedBy || [];
    if (passed.indexOf(myTeamId) !== -1) return;

    return {
      locked: true,
      pressedBy: myTeamId,
      pressedByName: myTeamName,
      passedBy: passed,
      time: Date.now()
    };
  });
}

function passTurn() {
  if (!currentRoom || !myTeamId) return;

  if (navigator.vibrate) navigator.vibrate([20, 30, 20]);

  var buzzerRef = db.ref("rooms/" + currentRoom + "/buzzer");
  
  buzzerRef.transaction(function(buzzer) {
    if (!buzzer || buzzer.pressedBy !== myTeamId) return;
    
    var passed = buzzer.passedBy || [];
    if (passed.indexOf(myTeamId) === -1) {
      passed.push(myTeamId);
    }

    return {
      locked: false,
      pressedBy: null,
      pressedByName: null,
      passedBy: passed,
      time: Date.now()
    };
  });
}
