name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Build-Tools
        uses: android-actions/setup-android@v3

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp -r index.html manifest.json sw.js *.png www/ 2>/dev/null || cp -r * www/ 2>/dev/null || true

      - name: Install Dependencies
        run: npm install

      - name: Initialize Android Project
        run: |
          npx cap add android
          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            npx @capacitor/assets generate --android 2>/dev/null || true
          fi
          npx cap sync android

      - name: Build Unsigned APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Restore Static Keystore & Sign APK
        run: |
          # Восстанавливаем статический ключ (пароль: reversquizpass)
          echo "" > /tmp/static-key.txt
          
          # Генерируем валидный PKCS12 с жестко зашитым seed
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/key.pem -out /tmp/cert.pem -days 10000 -nodes -subj "/CN=ReversQuiz/O=Revers/C=RU"
          openssl pkcs12 -export -in /tmp/cert.pem -inkey /tmp/key.pem -out /tmp/fixed_release.p12 -name reversquiz -passout pass:reversquizpass

          # Выравниваем и подписываем APK через apksigner
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          
          $BUILD_TOOLS_DIR/zipalign -v -p 4 $APK_PATH /tmp/aligned.apk || cp $APK_PATH /tmp/aligned.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks /tmp/fixed_release.p12 --ks-pass pass:reversquizpass --ks-key-alias reversquiz --key-pass pass:reversquizpass --out $APK_PATH /tmp/aligned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Revers-Quiz-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
