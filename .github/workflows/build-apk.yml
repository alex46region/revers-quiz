name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp -r index.html manifest.json sw.js *.png www/ 2>/dev/null || cp -r * www/ 2>/dev/null || true

      - name: Install Dependencies
        run: npm install

      - name: Initialize Android Project
        run: |
          npx cap add android
          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            npx @capacitor/assets generate --android 2>/dev/null || true
          fi
          npx cap sync android

      - name: Create Permanent Signing Keystore
        run: |
          cd android/app
          keytool -genkeypair -v -keystore my-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-key-alias -storepass reversquizpass -keypass reversquizpass -dname "CN=ReversQuiz, OU=App, O=Revers, L=City, S=State, C=RU"

      - name: Configure Gradle Signing
        run: |
          cd android/app
          sed -i '/defaultConfig {/a \        signingConfig signingConfigs.debug' build.gradle
          sed -i '/buildTypes {/i \    signingConfigs {\n        debug {\n            storeFile file("my-release-key.jks")\n            storePassword "reversquizpass"\n            keyAlias "my-key-alias"\n            keyPassword "reversquizpass"\n        }\n    }' build.gradle

      - name: Build APK with Fixed Signature
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Revers-Quiz-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
