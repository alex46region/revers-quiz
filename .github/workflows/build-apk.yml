name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Build-Tools
        uses: android-actions/setup-android@v3

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp -r index.html manifest.json sw.js version.json *.png www/ 2>/dev/null || cp -r * www/ 2>/dev/null || true

      - name: Install Dependencies
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Android Project
        run: |
          npx cap add android
          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            npx @capacitor/assets generate --android 2>/dev/null || true
          fi
          npx cap sync android

      - name: Configure Android Permissions and FileProvider
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Добавляем разрешение на установку APK
          sed -i '/<application/i \    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />' $MANIFEST

      - name: Setup Constant Keystore & Sign APK
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -alias reversquiz -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore ~/.android/permanent.keystore \
            -storepass "reversquizpass" -keypass "reversquizpass" \
            -dname "CN=ReversQuiz, O=App, C=RU" -noprompt

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          
          $BUILD_TOOLS_DIR/zipalign -v -p 4 $APK_PATH /tmp/aligned.apk || cp $APK_PATH /tmp/aligned.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks ~/.android/permanent.keystore --ks-pass pass:reversquizpass --ks-key-alias reversquiz --key-pass pass:reversquizpass --out $APK_PATH /tmp/aligned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Revers-Quiz-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
